switch:
  - platform: ld2410
    engineering_mode:
      id: sw_eng
      name: "Engineering mode"
      entity_category: config
    bluetooth:
      name: "Radar Bluetooth"
      entity_category: config
  - platform: template
    id: presence_led
    name: "Presence LED"
    icon: mdi:led-on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - script.execute: led_update
    on_turn_off:
      - script.execute: led_update

select:
  - platform: ld2410
    distance_resolution:
      id: sel_res
      name: "Distance resolution"     # 0.75 m (default) or 0.2 m per gate
      entity_category: config
    light_function:
      name: "Light function"
      entity_category: config
    out_pin_level:
      name: "OUT pin level"
      entity_category: config

button:
  - platform: template
    name: "SEN55 clean fan"
    icon: mdi:fan-alert
    entity_category: diagnostic
    on_press:
      - sen5x.start_fan_autoclean: sen55
  - platform: ld2410
    factory_reset:
      name: "Radar factory reset"
      entity_category: diagnostic
    restart:
      name: "Radar restart"
      entity_category: diagnostic
    query_params:
      id: btn_query
      name: "Radar query settings"
      entity_category: diagnostic
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

text_sensor:
  # v0.4 status texts - bands and wording copied from fresh-air-aqi (nu-esp32-s3-1.yaml)
  - platform: template
    name: "AQI AH"
    icon: "mdi:water-opacity"
    update_interval: 5.3s
    lambda: |-
      float ah = id(a_h).state;
      if (isnan(ah)) return {"Warming up"};
      char buf[48];
      if      (ah <= 6.0f)  snprintf(buf, sizeof(buf), "Very Dry (%.1f g/m³)", ah);
      else if (ah <= 8.0f)  snprintf(buf, sizeof(buf), "Dry (%.1f g/m³)", ah);
      else if (ah <= 10.5f) snprintf(buf, sizeof(buf), "Comfortable (%.1f g/m³)", ah);
      else if (ah <= 12.0f) snprintf(buf, sizeof(buf), "Humid (%.1f g/m³)", ah);
      else if (ah <= 15.0f) snprintf(buf, sizeof(buf), "Very Humid (%.1f g/m³)", ah);
      else                  snprintf(buf, sizeof(buf), "Excessive (%.1f g/m³)", ah);
      return {buf};
  - platform: template
    name: "AQI Dew Point"
    icon: "mdi:water-thermometer"
    update_interval: 5.2s
    lambda: |-
      float dp = id(dew_point).state;
      if (isnan(dp)) return {"Warming up"};
      char buf[48];
      if      (dp < 40.0f)  snprintf(buf, sizeof(buf), "Very Dry (%.1f °F)", dp);
      else if (dp < 50.0f)  snprintf(buf, sizeof(buf), "Dry (%.1f °F)", dp);
      else if (dp < 55.0f)  snprintf(buf, sizeof(buf), "Pleasant (%.1f °F)", dp);
      else if (dp < 60.0f)  snprintf(buf, sizeof(buf), "Comfortable (%.1f °F)", dp);
      else if (dp < 65.0f)  snprintf(buf, sizeof(buf), "Muggy (%.1f °F)", dp);
      else if (dp < 70.0f)  snprintf(buf, sizeof(buf), "Uncomfortable (%.1f °F)", dp);
      else                  snprintf(buf, sizeof(buf), "Oppressive (%.1f °F)", dp);
      return {buf};
  - platform: template
    name: "AQI TVOC"
    icon: "mdi:flask-outline"
    update_interval: 5.4s
    lambda: |-
      float v = id(voc).state;
      if (isnan(v) || v <= 0) return {"Warming up"};
      char buf[64];
      if      (v <= 150) snprintf(buf, sizeof(buf), "Excellent (%.0f index)", v);
      else if (v <= 250) snprintf(buf, sizeof(buf), "Good (%.0f index)", v);
      else if (v <= 350) snprintf(buf, sizeof(buf), "Moderate (%.0f index)", v);
      else if (v <= 450) snprintf(buf, sizeof(buf), "Unhealthy for Sensitive Groups (%.0f index)", v);
      else if (v <= 500) snprintf(buf, sizeof(buf), "Unhealthy (%.0f index)", v);
      else               snprintf(buf, sizeof(buf), "Warming up");
      return {buf};
  - platform: template
    name: "AQI NOx"
    icon: "mdi:smog"
    update_interval: 5.5s
    lambda: |-
      float n = id(nox).state;
      if (isnan(n) || n <= 0) return {"Warming up"};
      char buf[64];
      if      (n <= 50)  snprintf(buf, sizeof(buf), "Excellent (%.0f index)", n);
      else if (n <= 100) snprintf(buf, sizeof(buf), "Good (%.0f index)", n);
      else if (n <= 200) snprintf(buf, sizeof(buf), "Moderate (%.0f index)", n);
      else if (n <= 300) snprintf(buf, sizeof(buf), "Poor (%.0f index)", n);
      else if (n <= 400) snprintf(buf, sizeof(buf), "Very Poor (%.0f index)", n);
      else if (n <= 500) snprintf(buf, sizeof(buf), "Hazardous (%.0f index)", n);
      else               snprintf(buf, sizeof(buf), "Warming up");
      return {buf};
  - platform: template
    name: "AQI PM"
    icon: "mdi:air-filter"
    update_interval: 5.6s
    lambda: |-
      // the "PM AQI" sensor's value in words (one calculation, so the two always agree)
      float a = id(avg_pm_aqi).state;
      if (isnan(a)) return std::string("Warming up");
      int v = (int) lroundf(a);
      const char *w = v <= 10 ? "Excellent" : v <= 50 ? "Good" : v <= 100 ? "Moderate" :
                      v <= 150 ? "Unhealthy for Sensitive Groups" : v <= 200 ? "Unhealthy" :
                      v <= 300 ? "Very Unhealthy" : "Hazardous";
      char buf[64];
      snprintf(buf, sizeof(buf), "%s (%d index)", w, v);
      return std::string(buf);
  - platform: template
    name: "Unit Temperature Status"
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      float t = id(esp_temp).state;
      if (isnan(t)) return {};
      return {t >= 185 ? "Overheating" : t >= 140 ? "Warm" : "Normal"};
  - platform: ld2410
    version:
      id: ts_fw
      name: "Radar firmware"
      entity_category: diagnostic
    mac_address:
      name: "Radar MAC"
      entity_category: diagnostic

# -------------------------------------------------------
# LED - the Super Mini's WS2812 on GPIO48. Shows through the radome's dot grid.
# Blue = moving target, green = still target only, off = clear.
# -------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "LED"
    chipset: WS2812
    pin: GPIO48
    num_leds: 1
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms

script:
  - id: led_update
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_on: presence_led
              - binary_sensor.is_on: bs_mv
          then:
            - light.turn_on:          # moving target -> blue
                id: led
                brightness: 40%
                red: 0
                green: 0.1
                blue: 1
          else:
            - if:
                condition:
                  and:
                    - switch.is_on: presence_led
                    - binary_sensor.is_on: occupied
                then:
                  - light.turn_on:    # occupied, still only -> green
                      id: led
                      brightness: 30%
                      red: 0
                      green: 1
                      blue: 0
                else:
                  - light.turn_off:
                      id: led
