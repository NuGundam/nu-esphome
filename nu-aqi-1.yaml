# NU-AQI-1 — device-specific values only.
# All logic lives in common/nuaqi-common.yaml (edit that to change every unit).
substitutions:
  device_name: nu-aqi-1
  friendly_name: NU-AQI-1
  api_key: !secret api_key
  ota_password: !secret ota_password
  ap_ssid: "Nu-Aqi-1 Fallback Hotspot"
  ap_password: !secret ap_password
packages:
  nuaqi_common: !include common/nuaqi-common.yaml
# 2026-11-06 one-device Wi-Fi test: the router heard this unit at -73..-77 dBm while the adaptive loop sat at its
# 8.5 dBm floor (quality 74 % is inside its 55-75 dead band, so it never stepped up). Fixed 14 dBm with "Adaptive
# WiFi TX Power" switched OFF in HA; the loop re-asserts its own setpoint while on. Merges into the package wifi: block.
wifi:
  output_power: 14dB
