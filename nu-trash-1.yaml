# =======================================================
# NU-Trash-1  v0.3 (2026-11-17; first flashed 2026-11-16 over USB)
# v0.3: Gas Resistance and Gas Resistance Fast in kilo-ohms (were ohms);
#   AGS10 package switched on.
# v0.4: every entity name starts with the chip that reports it (SGP41,
#   BME688, AGS10); AQI texts as on the NU-AQI units (AH, TVOC, NOx,
#   Combined Level, and TVOC from the AGS10).
# v0.5: AQI texts for gas resistance and pressure; pressure sends its
#   first value after 1 min (was 5); AQI LED on the board's WS2812
#   (GPIO48) shows the combined level like the NU-AQI units.
# v0.6 (2026-11-17): BME688 in gas-scan mode (common/nu-trash-bme688-scan.yaml,
#   local component components/bme688_scan): the heater steps through ten
#   temperatures and "BME688 Scan" sends the ten step resistances once a
#   minute - the fingerprint for the odor-type model. No BSEC any more, so
#   IAQ Static / IAQ Accuracy are gone; Gas Resistance = the 320 C step.
# v0.7 (2026-11-18): one gas scan a minute (was every 30 s: the chip ran
#   10 C warm and humidity read 10 points high); T-Offset range -20..10.
# v0.8 (2026-11-18): temperature / humidity are read at the start of each
#   scan (rested chip), not at its hot end.
# Odor sensor that lives INSIDE the kitchen trash cabinet.
# ESP32-S3 Super Mini + GY-SGP41 + BME688 breakout (+ optional AGS10).
# v0.2: BME688 instead of the BME680 (it also reacts to sulfur compounds,
#   the smell of rotting food). The climate/gas sensor is now a package:
#   common/nu-trash-bme688.yaml (default) or common/nu-trash-bme680.yaml.
#
# Why: the kitchen AirGradient read a normal 70-90 the night the bag
# smelled (2026-11-13). This unit sits next to the bin, so HA can compare
# cabinet air with kitchen air (same SGP41 chip and VOC index as NU-AQI).
#
# Channels
#   SGP41  VOC Index (smoothed, one value a minute), VOC Fast (unsmoothed,
#          sent on a move of 5), NOx Index. Same algorithm tuning as
#          nuaqi-common, so the numbers compare with the NU-AQI units.
#          NOTE: the VOC index is relative to the chip's own learned
#          baseline (240 h). A smell that builds over days is partly
#          learned away, in this unit as in every other one.
#   BME688 Temperature / Humidity (feed the SGP41 compensation), Pressure,
#          and Gas Resistance = an ABSOLUTE reading (ohms, falls when VOCs
#          rise) with no self-learning baseline. It also falls with
#          humidity, so read it together with Humidity. Plus "IAQ Static"
#          from Bosch's BSEC2 library (needs days to calibrate).
#   AGS10  optional third channel, TVOC in ppb, also absolute. Add the
#          package line below when the module is wired.
#
# Wiring (ESP32-S3 Super Mini pin labels; all sensors on 3V3 logic)
#   Bus A, 100 kHz
#     GY-SGP41  VIN -> 3V3   GND -> GND   SDA -> GPIO5   SCL -> GPIO4   (0x59)
#     BME688    VCC -> 3V3   GND -> GND   SDA -> GPIO5   SCL -> GPIO4
#               SDO -> leave open (0x77 on most 6-pin boards) or GND (0x76)
#               CS  -> leave open (the board pulls it high = I2C mode)
#   Bus B, 15 kHz (AGS10 only, see common/nu-trash-ags10.yaml)
#     AGS10     VCC -> 3V3 (breakout with regulator)   GND -> GND
#               SDA -> GPIO7   SCL -> GPIO6                             (0x1A)
#   Power: USB-C, any 5 V / 0.5 A supply. Nothing connects to the 5V pin.
#
# Pin choice: GPIO4/5 = the I2C pins every other Super Mini in the fleet
# uses. GPIO6/7 = the next pair on the same header edge. Left alone:
# GPIO3 (strapping pin), GPIO43/44 (UART0 TX/RX), GPIO19/20 (USB, not on
# the header), GPIO48 (the board's WS2812 = the AQI LED since v0.5).
# The ESP32's internal pull-ups are on; the breakouts carry their own too.
#
# Keys: same layout as nu-garage-1.yaml. The live copy in /config/esphome
# holds the real API key (made by the ESPHome dashboard) and the hotspot
# password; this local copy keeps placeholders. OTA reuses the API key.
# No custom web page, so no Visit-link flags and no mdns_web_slot.
# =======================================================
substitutions:
  device_name: nu-trash-1
  friendly_name: NU-Trash-1
  api_key: !secret api_key
  ap_ssid: "Nu-Trash-1 Hotspot"
  ap_password: !secret ap_password
  bme_address: "0x77"           # SDO open on most 6-pin boards; 0x76 with SDO to GND. Check the boot I2C scan.
  aqi_led_brightness: "40%"     # AQI LED; it sits inside a closed cabinet
  wifi_tx_power: 14dB           # inside a closed cabinet; lower = less heat next to the sensors

packages:
  wifi_diag: !include common/wifi-diag.yaml   # BSSID / Access Point / reconnects / TX power
  wifi_steer: !include common/wifi-steer.yaml   # keep on the strongest mesh node (2026-11-19)
  # Climate + gas sensor: keep ONE of these two lines.
  bme: !include common/nu-trash-bme688-scan.yaml   # v0.6: gas scan (no BSEC)
  # bme: !include common/nu-trash-bme688.yaml      # BSEC: IAQ Static, no scan
  # bme: !include common/nu-trash-bme680.yaml
  # Optional AGS10 on the second I2C bus. Put a "#" in front to leave it out:
  ags10: !include common/nu-trash-ags10.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: "nu.trash"
    version: "0.8"

esp32:
  variant: esp32s3              # ESP32-S3FH4R2: 4 MB flash in the chip, 2 MB PSRAM (not used)
  flash_size: 4MB
  cpu_frequency: 80MHz          # three I2C sensors; runs cooler
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG   # the board has native USB only, no UART bridge
  level: INFO

api:
  encryption:
    key: "${api_key}"
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: ${wifi_tx_power}
  fast_connect: true
  power_save_mode: light
  reboot_timeout: 15min
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}

captive_portal:

# -------------------------------------------------------
# I2C bus A: SGP41 + BME688
# -------------------------------------------------------
i2c:
  - id: bus_a
    sda: GPIO5
    scl: GPIO4
    frequency: 100kHz
    scan: true

# -------------------------------------------------------
# NUMBERS (calibration, kept over reboots)
# -------------------------------------------------------
number:
  # Added to the BME temperature. The chip warms itself a little (gas
  # heater) and sits in the same case as the ESP32: compare with a known
  # thermometer in the cabinet and enter the difference (usually negative).
  - platform: template
    name: "${bme_name} T-Offset"
    id: t_offset
    entity_category: "config"
    unit_of_measurement: "°C"
    min_value: -20
    max_value: 10
    step: 0.1
    optimistic: true
    restore_value: true
    initial_value: 0
    mode: box

# -------------------------------------------------------
# SENSORS
# -------------------------------------------------------
sensor:
  # ---------------- SGP41: VOC + NOx index (primary odor channel) ----------------
  - platform: sgp4x
    i2c_id: bus_a
    id: sgp41_vn
    voc_index:
      name: "SGP41 VOC Index"
      id: sgp41_voc
      icon: "mdi:flask-outline"
      algorithm_tuning:           # same values as nuaqi-common v2.4
        index_offset: 100
        learning_time_offset_hours: 240
        learning_time_gain_hours: 240
        gating_max_duration_minutes: 360
        std_initial: 150
        gain_factor: 120
      filters:
        - exponential_moving_average:
            alpha: 0.05
            send_every: 6         # one smoothed value a minute
      # every unsmoothed value (one per 10 s) also goes to "VOC Fast" below
      on_raw_value:
        then:
          - if:
              condition:
                lambda: 'return !isnan(x);'
              then:
                - sensor.template.publish:
                    id: sgp41_voc_fast
                    state: !lambda 'return x;'
    nox_index:
      name: "SGP41 NOx Index"
      id: sgp41_nox
      icon: "mdi:smog"
      filters:
        - exponential_moving_average:
            alpha: 0.2
            send_every: 6
    compensation:
      temperature_source: bme_temp
      humidity_source: bme_hum
    store_baseline: true
    update_interval: 10s
  # The VOC index without the smoothing: any move of 5 points at once, plus
  # one value every 5 minutes (same rule as "VOC Fast" on the NU-AQI units).
  - platform: template
    name: "SGP41 VOC Fast"
    id: sgp41_voc_fast
    icon: "mdi:flask-outline"
    state_class: "measurement"
    accuracy_decimals: 0
    update_interval: never
    filters:
      - or:
          - throttle: 300s
          - delta: 5.0

  # ---------------- BME688 / BME680: see the bme package ----------------
  # Unsmoothed gas resistance: sent when it moves 10 %, plus one value every 5 minutes.
  - platform: template
    name: "${bme_name} Gas Resistance Fast"
    id: bme_gas_fast
    icon: "mdi:gas-cylinder"
    unit_of_measurement: "kΩ"
    state_class: "measurement"
    accuracy_decimals: 1
    update_interval: never
    filters:
      - or:
          - throttle: 300s
          - delta: 10%
  # Dew point: the SGP41 must stay out of condensing air (over 90 % RH).
  - platform: template
    name: "${bme_name} Dew Point"
    id: dew_point
    icon: "mdi:thermometer-water"
    unit_of_measurement: "°C"
    device_class: "temperature"
    state_class: "measurement"
    accuracy_decimals: 1
    update_interval: 60s
    lambda: |-
      float t = id(bme_temp).state, rh = id(bme_hum).state;
      if (isnan(t) || isnan(rh) || rh <= 0.0f) return NAN;
      float g = logf(rh / 100.0f) + 17.62f * t / (243.12f + t);
      return 243.12f * g / (17.62f - g);
    filters:
      - delta: 0.2

  # ---------------- diagnostics (names as on the rest of the fleet) ----------------
  - platform: wifi_signal
    id: s_rssi
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
    filters:
      - delta: 1
  - platform: template
    name: "WiFi Signal Quality"
    id: wifi_quality
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:wifi"
    update_interval: 60s
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(s_rssi).state)) return {};
      int q = 2 * (100 + (int) id(s_rssi).state);
      return (float) std::clamp(q, 0, 100);
    filters:
      - delta: 1
  - platform: uptime
    id: s_uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: internal_temperature
    name: "ESP32 Internal Temperature (F)"
    id: esp_temp
    icon: "mdi:chip"
    update_interval: 60s
    unit_of_measurement: "°F"
    entity_category: diagnostic
    filters:
      - lambda: return (x * 1.8) + 32;
      - delta: 1

# -------------------------------------------------------
# TEXT SENSORS
# -------------------------------------------------------
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "ESP32 IP Address"
      icon: "mdi:ip-network"
      entity_category: diagnostic
  # Plain-words warning for the cabinet: the SGP41 datasheet forbids over 90 % RH.
  - platform: template
    name: "${bme_name} Humidity Status"
    icon: "mdi:water-alert"
    entity_category: diagnostic
    update_interval: 60s
    lambda: |-
      float rh = id(bme_hum).state;
      if (isnan(rh)) return {"Warming up"};
      if (rh >= 90.0f) return {"Too wet"};
      if (rh >= 80.0f) return {"Damp"};
      return {"Normal"};
  # ---- AQI texts, same wording and bands as the NU-AQI units ----
  - platform: template
    name: "AQI AH (${bme_name})"
    icon: "mdi:water-opacity"
    update_interval: 10s
    lambda: |-
      float t = id(bme_temp).state, rh = id(bme_hum).state;
      if (isnan(t) || isnan(rh)) return {"Warming up"};
      float ah = 216.7f * (rh / 100.0f * 6.112f * expf(17.62f * t / (243.12f + t))) / (273.15f + t);
      char buf[48];
      const char* label =
        (ah <= 6.0f)  ? "Very Dry" :
        (ah <= 8.0f)  ? "Dry" :
        (ah <= 10.5f) ? "Comfortable" :
        (ah <= 12.0f) ? "Humid" :
        (ah <= 15.0f) ? "Very Humid" : "Excessive";
      snprintf(buf, sizeof(buf), "%s (%.1f g/m³)", label, ah);
      return {buf};
  - platform: template
    name: "AQI TVOC (SGP41)"
    icon: "mdi:flask-outline"
    update_interval: 10s
    lambda: |-
      float v = id(sgp41_voc).state;
      if (isnan(v) || v <= 0) return {"Warming up"};
      char buf[64];
      const char* label =
        (v <= 150) ? "Excellent" :
        (v <= 250) ? "Good" :
        (v <= 350) ? "Moderate" :
        (v <= 450) ? "Unhealthy for Sensitive Groups" : "Unhealthy";
      snprintf(buf, sizeof(buf), "%s (%.0f index)", label, v);
      return {buf};
  - platform: template
    name: "AQI NOx (SGP41)"
    icon: "mdi:smog"
    update_interval: 10s
    lambda: |-
      float n = id(sgp41_nox).state;
      if (isnan(n) || n < 1) return {"Warming up"};
      char buf[64];
      const char* label =
        (n <=  50) ? "Excellent" :
        (n <= 100) ? "Good" :
        (n <= 200) ? "Moderate" :
        (n <= 300) ? "Poor" :
        (n <= 400) ? "Very Poor" : "Hazardous";
      snprintf(buf, sizeof(buf), "%s (%.0f index)", label, n);
      return {buf};
  # Gas resistance in words. There is no standard scale for it: these bands
  # are a first guess (higher = cleaner) to be tuned after a bag cycle.
  - platform: template
    name: "AQI Gas Resistance (${bme_name})"
    icon: "mdi:gas-cylinder"
    update_interval: 10s
    lambda: |-
      float g = id(bme_gas).state;          // kilo-ohms
      if (isnan(g) || g <= 0) return {"Warming up"};
      char buf[48];
      const char* label =
        (g >= 50.0f) ? "Excellent" :
        (g >= 25.0f) ? "Good" :
        (g >= 10.0f) ? "Moderate" :
        (g >=  5.0f) ? "Poor" : "Very Poor";
      snprintf(buf, sizeof(buf), "%s (%.1f kΩ)", label, g);
      return {buf};
  - platform: template
    name: "AQI Pressure (${bme_name})"
    icon: "mdi:gauge"
    update_interval: 10s
    lambda: |-
      float p = id(bme_press).state;        // hPa
      if (isnan(p) || p <= 0) return {"Warming up"};
      char buf[48];
      const char* label = (p < 1000.0f) ? "Low" : (p <= 1020.0f) ? "Normal" : "High";
      snprintf(buf, sizeof(buf), "%s (%.2f inHg)", label, p * 0.02953f);
      return {buf};
  # Worst of the SGP41 VOC and NOx levels (the NU-AQI rule without CO2 and PM).
  # The score is worked out in "interval:" below; the AQI LED shows the same level.
  - platform: template
    name: "AQI Combined Level"
    icon: "mdi:air-filter"
    update_interval: 10s
    lambda: |-
      int lvl = id(aqi_level_score);
      if (lvl < 0) return {"Warming up"};
      static const char* const L[] = {
        "Excellent", "Good", "Moderate", "Unhealthy for Sensitive Groups", "Unhealthy"};
      return {L[lvl > 4 ? 4 : lvl]};

# -------------------------------------------------------
# BUTTONS
# -------------------------------------------------------
button:
  - platform: restart
    name: "ESP32-S3 Reboot"
    icon: "mdi:restart"
    entity_category: config

# -------------------------------------------------------
# AQI LED (v0.5): the board's own WS2812 shows the combined level, with the
# NU-AQI colours: green / yellow / orange (pulsing) / red (pulsing) / purple
# (pulsing); blue blink while warming up. "AQI LED Enabled" turns it off.
# -------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    name: "AQI LED"
    id: aqi_led_strip
    chipset: WS2812
    pin: GPIO48
    num_leds: 1
    rgb_order: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms

switch:
  - platform: template
    name: "AQI LED Enabled"
    id: aqi_led_enabled
    icon: "mdi:led-on"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          if (id(aqi_level_score) >= 0) id(update_aqi_led).execute();
          else { id(aqi_level_score) = -1; id(warmup_blink).execute(); }
    turn_off_action:
      - script.stop: warmup_blink
      - script.stop: aqi_pulse_control
      - script.stop: update_aqi_led
      - light.turn_off:
          id: aqi_led_strip

globals:
  - id: aqi_level_score        # -2 = just booted, -1 = warming up, 0..4 = level
    type: int
    restore_value: no
    initial_value: '-2'
  - id: aqi_r
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: aqi_g
    type: float
    restore_value: no
    initial_value: '0.0'
  - id: aqi_b
    type: float
    restore_value: no
    initial_value: '0.0'

interval:
  - interval: 10s
    then:
      - lambda: |-
          float v = id(sgp41_voc).state, n = id(sgp41_nox).state;
          int lvl = -1;
          if (!isnan(v) && v > 0) {
            int vs = (v <= 150) ? 0 : (v <= 250) ? 1 : (v <= 350) ? 2 : (v <= 450) ? 3 : 4;
            int ns = (isnan(n) || n <= 100) ? 0 : (n <= 200) ? 1 : (n <= 300) ? 2 : (n <= 400) ? 3 : 4;
            lvl = vs > ns ? vs : ns;
          }
          if (lvl == id(aqi_level_score)) return;
          id(aqi_level_score) = lvl;
          if (!id(aqi_led_enabled).state) return;
          if (lvl < 0) id(warmup_blink).execute();
          else id(update_aqi_led).execute();

script:
  - id: update_aqi_led
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(aqi_level_score) >= 0;'
          then:
            - script.stop: warmup_blink
            - lambda: |-
                float r, g, b;
                switch (id(aqi_level_score)) {
                  case 0: r=0.0f;   g=0.894f; b=0.0f;   break;
                  case 1: r=1.0f;   g=1.0f;   b=0.0f;   break;
                  case 2: r=1.0f;   g=0.494f; b=0.0f;   break;
                  case 3: r=1.0f;   g=0.0f;   b=0.0f;   break;
                  default: r=0.561f; g=0.247f; b=0.592f; break;
                }
                id(aqi_r) = r;
                id(aqi_g) = g;
                id(aqi_b) = b;
            - if:
                condition:
                  lambda: 'return id(aqi_level_score) >= 2;'
                then:
                  - script.execute: aqi_pulse_control
                else:
                  - script.stop: aqi_pulse_control
                  - light.turn_on:
                      id: aqi_led_strip
                      red: !lambda 'return id(aqi_r);'
                      green: !lambda 'return id(aqi_g);'
                      blue: !lambda 'return id(aqi_b);'
                      brightness: ${aqi_led_brightness}
  - id: aqi_pulse_control
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return id(aqi_level_score) >= 2;'
          then:
            - light.turn_on:
                id: aqi_led_strip
                red: !lambda 'return id(aqi_r);'
                green: !lambda 'return id(aqi_g);'
                blue: !lambda 'return id(aqi_b);'
                brightness: ${aqi_led_brightness}
                transition_length: 800ms
            - delay: 1000ms
            - light.turn_off:
                id: aqi_led_strip
            - delay: !lambda |-
                switch (id(aqi_level_score)) {
                  case 2: return 900;
                  case 3: return 800;
                  case 4: return 700;
                  default: return 1000;
                }
  - id: warmup_blink
    mode: single
    then:
      - while:
          condition:
            lambda: 'return id(aqi_level_score) == -1;'
          then:
            - light.turn_on:
                id: aqi_led_strip
                red: 0.0
                green: 0.4
                blue: 1.0
                brightness: ${aqi_led_brightness}
            - delay: 1000ms
            - light.turn_off:
                id: aqi_led_strip
            - delay: 1000ms
