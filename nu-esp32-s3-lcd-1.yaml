esphome:
  on_boot:
    then:
      - light.turn_on:
          id: lcd_backlight
          brightness: 50%
  name: nu-esp32-s3-lcd-1
  friendly_name: NU-ESP32-S3-LCD-1
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
  variant: esp32s3
time:
  - platform: homeassistant
    id: home_time
logger:
  baud_rate: 115200
  level: INFO
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
ota:
  - platform: esphome
    password: !secret ota_password
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 14.0dB
  fast_connect: true
  reboot_timeout: 0s
  power_save_mode: light
  ap:
    ssid: "Nu-Esp32-S3-Lcd-1"
    password: !secret ap_password
captive_portal:
# Internal temperature sensor
sensor:
  - platform: internal_temperature
    name: "ESP32 Internal Temperature"
    id: internal_temp
    update_interval: 10s
  - platform: wifi_signal
    #name: "WiFi Signal"
    id: wifi_strength
    update_interval: 10s
  # Calculate signal quality as percentage
  - platform: template
    name: "WiFi Signal Quality"
    id: wifi_quality
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:wifi"
    update_interval: 60.1s
    lambda: |-
      int quality = 2 * (100 + id(wifi_strength).state);
      if (quality > 100) {
      return 100;
      } else if (quality < 0) {
      return 0;
      } else {
      return quality;
      }
    filters:
    - delta: 1
    entity_category: "diagnostic"
# Correct SPI pins for SpotPear ESP32-S3-LCD-1.47 board
spi:
  id: bus_spi
  clk_pin: GPIO40
  mosi_pin: GPIO45
display:
  - platform: mipi_spi
    id: my_display
    model: ST7789V
    cs_pin: GPIO42
    dc_pin: GPIO41
    reset_pin: GPIO39
    dimensions:
      width: 172
      height: 320
      offset_width: 34
      offset_height: 0
    rotation: 90
    invert_colors: true
    color_order: RGB
    buffer_size: 100%
    lambda: |-
      it.fill(Color(0, 0, 0));
      // Temperature in Fahrenheit
      float temp_f = (id(internal_temp).state * 1.8) + 32.0;
      it.printf(10, 10, id(my_font), Color(255, 255, 255), "Temp: %.1f°F", temp_f);
      // WiFi signal in dBm
      float rssi = id(wifi_strength).state;
      int x_base = 10;
      int y_base = 40;
      it.printf(x_base, y_base, id(my_font), Color(255, 255, 255), "WiFi: %.1f dBm", rssi);
      // Estimate end of text to position bars
      int text_width = 160;  // estimate of "WiFi: -XX dBm"
      int bar_x = x_base + text_width;
      // Draw inline horizontal WiFi signal bars
      int bar_width = 5;
      int bar_spacing = 3;
      int bar_base_y = y_base + 14;  // align with text baseline
      int bars = 0;
      if (rssi >= -50) {
        bars = 5;
      } else if (rssi >= -60) {
        bars = 4;
      } else if (rssi >= -70) {
        bars = 3;
      } else if (rssi >= -80) {
        bars = 2;
      } else if (rssi >= -90) {
        bars = 1;
      }
      for (int i = 0; i < bars; i++) {
        int height = (i + 1) * 3;
        it.filled_rectangle(bar_x + i * (bar_width + bar_spacing), bar_base_y - height, bar_width, height, Color(255, 255, 255));
      }
      // SSID
      if (id(wifi_info_ssid).has_state()) {
        it.printf(10, 70, id(my_font), Color(255, 255, 255), "SSID: %s", id(wifi_info_ssid).state.c_str());
      }
      // IP Address
      if (id(wifi_info_ip).has_state()) {
        it.printf(10, 100, id(my_font), Color(255, 255, 255), "IP: %s", id(wifi_info_ip).state.c_str());
      }
      if (id(home_time).now().is_valid()) {
        auto now = id(home_time).now();
        it.strftime(10, 130, id(my_font), Color(255, 255, 255), "Time: %H:%M:%S", now);
      }
font:
  - file:
      type: gfonts
      family: Roboto
      weight: 900
    id: my_font
    size: 16
output:
  - platform: ledc
    pin: GPIO46
    id: lcd_bl_output
light:
  - platform: monochromatic
    output: lcd_bl_output
    id: lcd_backlight
    name: "LCD Backlight"
    restore_mode: ALWAYS_ON
  - platform: esp32_rmt_led_strip
    name: "AQI LED"
    id: aqi_led_strip
    chipset: WS2812
    pin: GPIO38
    num_leds: 1
    channel_colors: RGB
# Template Text Sensor for Threshold
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "ESP32 IP Address"
      id: wifi_info_ip
    ssid:
      name: "SSID"
      id: wifi_info_ssid
interval:
  - interval: 1s
    then:
      - component.update: my_display