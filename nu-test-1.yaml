esphome:
  name: nu-test-1
  friendly_name: Nu-Test-1

esp32:
  board: arduino_nano_esp32
  framework:
    type: esp-idf

logger:
  baud_rate: 115200
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 14.0dB
  fast_connect: true
  reboot_timeout: 0s
  power_save_mode: light
  ap:
    ssid: "Nu-Test-1 Fallback Hotspot"
    password: !secret ap_password

captive_portal:

output:
  - platform: ledc
    pin: GPIO46  # Red
    id: output_red
    inverted: true
  - platform: ledc
    pin: GPIO0   # Green
    id: output_green
    inverted: true
  - platform: ledc
    pin: GPIO45  # Blue
    id: output_blue
    inverted: true

light:
  - platform: rgb
    name: "Nano ESP32 RGB LED"
    id: onboard_led
    red: output_red
    green: output_green
    blue: output_blue

# -------------------------------------------------------
# I2C
# -------------------------------------------------------
i2c:
  sda: GPIO8
  scl: GPIO9
  scan: true

# -------------------------------------------------------
# SENSORS
# -------------------------------------------------------
sensor:  

  # SHT40 — Temp/Humidity
  - platform: sht4x
    id: sht40_th
    address: 0x44
    temperature:
      name: "Temperature"
      id: sht40_temperature_raw
      icon: "mdi:thermometer"
      accuracy_decimals: 1
      filters:
        - sliding_window_moving_average:
            window_size: 10
            send_every: 1
    humidity:
      name: "Humidity"
      id: sht40_humidity_raw
      icon: "mdi:water-percent"
      accuracy_decimals: 1
    update_interval: 3s
