# NU-Presence-2 (Family Room) - device-specific values only.
# All logic lives in common/mr60-presence-common.yaml (edit that to change every unit).
# Before the first flash: paste a fresh API key (ESPHome dashboard > Secrets, or
# "openssl rand -base64 32") and an AP password, like the NU-AQI units.
substitutions:
  device_name: nu-presence-2
  friendly_name: NU-Presence-2
  api_key: !secret api_key
  ap_ssid: "Nu-Presence-2 Fallback Hotspot"
  ap_password: !secret ap_password
packages:
  mr60_common: !include common/mr60-presence-common.yaml
