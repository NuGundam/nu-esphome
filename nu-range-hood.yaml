packages:
  wifi_diag: !include common/wifi-diag.yaml   # BSSID / Access Point / reconnects / TX power (2026-11-07)

esphome:
  name: nu-range-hood
  friendly_name: Nu-Range-Hood

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  baud_rate: 115200
  level: INFO

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 14.0dB
  fast_connect: true
  reboot_timeout: 0s
  power_save_mode: light
  ap:
    ssid: "Nu-Range-Hood Fallback Hotspot"
    password: !secret ap_password

captive_portal:

time:
  - platform: homeassistant
    id: homeassistant_time

# ─────────────────────────────────────────────
# Global: tracks which button physically turned the fan on
# 0 = none, 1/2/3 = button currently held ON
# ─────────────────────────────────────────────
globals:
  - id: active_button
    type: int
    restore_value: no
    initial_value: '0'
  - id: speed_was             # relay energised when apply_speed started (0 = none)
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_event_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# ─────────────────────────────────────────────
# Diagnostics
# ─────────────────────────────────────────────
sensor:
  - platform: wifi_signal
    id: wifi_signal_dbm
    update_interval: 60s
    entity_category: diagnostic

  - platform: copy
    source_id: wifi_signal_dbm
    name: "WiFi Signal Percent"
    unit_of_measurement: "%"
    device_class: ""
    entity_category: diagnostic
    filters:
      - lambda: |-
          if (x <= -100) return 0;
          if (x >= -50) return 100;
          return 2 * (x + 100);

binary_sensor:
  - platform: status
    name: "Status"

  - platform: gpio
    name: "Boot Button"
    pin:
      number: GPIO0
      ignore_strapping_warning: true
      mode:
        input: true
      inverted: true
    disabled_by_default: true
    on_press:
      - button.press: restart_button

  # ── Physical Speed Toggle Switch ──────────────────
  - platform: gpio
    name: "Speed 1 Toggle Switch"
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(fan_speed).current_option() != "Speed 1";'
            then:
              - globals.set:
                  id: active_button
                  value: '1'
              - select.set:
                  id: fan_speed
                  option: "Speed 1"
    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(active_button) == 1;'
            then:
              - globals.set:
                  id: active_button
                  value: '0'
              - select.set:
                  id: fan_speed
                  option: "Off"

  - platform: gpio
    name: "Speed 2 Toggle Switch"
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(fan_speed).current_option() != "Speed 2";'
            then:
              - globals.set:
                  id: active_button
                  value: '2'
              - select.set:
                  id: fan_speed
                  option: "Speed 2"
    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(active_button) == 2;'
            then:
              - globals.set:
                  id: active_button
                  value: '0'
              - select.set:
                  id: fan_speed
                  option: "Off"

  - platform: gpio
    name: "Speed 3 Toggle Switch"
    pin:
      number: GPIO8
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 20ms
    on_press:
      then:
        - if:
            condition:
              lambda: 'return id(fan_speed).current_option() != "Speed 3";'
            then:
              - globals.set:
                  id: active_button
                  value: '3'
              - select.set:
                  id: fan_speed
                  option: "Speed 3"
    on_release:
      then:
        - if:
            condition:
              lambda: 'return id(active_button) == 3;'
            then:
              - globals.set:
                  id: active_button
                  value: '0'
              - select.set:
                  id: fan_speed
                  option: "Off"

text_sensor:
  - platform: template
    id: relay_events
    name: "Relay events"          # last 4 relay moves / commands, oldest first, +ms since the previous one
    icon: mdi:electric-switch
    entity_category: diagnostic
    update_interval: never

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    mac_address:
      name: "MAC Address"
      entity_category: diagnostic

# ─────────────────────────────────────────────
# Fan Speed Selector (Single Control)
# ─────────────────────────────────────────────
select:
  - platform: template
    name: "Fan Speed"
    id: fan_speed
    optimistic: true
    options:
      - "Off"
      - "Speed 1"
      - "Speed 2"
      - "Speed 3"
    initial_option: "Off"
    # 2026-11-01: a repeated option (two HA automation runs racing) re-ran the old
    # all-off / 50 ms / on sequence and bounced relay 1 (likely the 4 clicks at 09:05:48).
    # Now only a real change moves a relay, and every move lands in "Relay events".
    on_value:
      then:
        - script.execute:
            id: apply_speed
            want: !lambda 'return (int) i;'

# ─────────────────────────────────────────────
# Relay Outputs (With Built-In Interlock)
# ─────────────────────────────────────────────
switch:
  - platform: gpio
    pin: GPIO1
    id: relay1
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: {id: relay_event, what: "R1 on"}
    on_turn_off:
      - script.execute: {id: relay_event, what: "R1 off"}
    interlock: [relay2, relay3]

  - platform: gpio
    pin: GPIO2
    id: relay2
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: {id: relay_event, what: "R2 on"}
    on_turn_off:
      - script.execute: {id: relay_event, what: "R2 off"}
    interlock: [relay1, relay3]

  - platform: gpio
    pin: GPIO41
    id: relay3
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: {id: relay_event, what: "R3 on"}
    on_turn_off:
      - script.execute: {id: relay_event, what: "R3 off"}
    interlock: [relay1, relay2]


# ─────────────────────────────────────────────
# RGB LED (WS2812)
# ─────────────────────────────────────────────
light:
  - platform: esp32_rmt_led_strip
    chipset: ws2812
    pin: GPIO38
    num_leds: 1
    channel_colors: RGB
    name: "RGB LED"
    id: rgb_led

# ─────────────────────────────────────────────
# Restart Button
# ─────────────────────────────────────────────
button:
  - platform: restart
    name: "Restart"
    id: restart_button
    entity_category: config

# ─────────────────────────────────────────────
# Speed changes (queued: each command sees the relays the previous one left)
# ─────────────────────────────────────────────
script:
  - id: apply_speed
    mode: queued
    max_runs: 5
    parameters:
      want: int
    then:
      - lambda: |-
          int was = id(relay1).state ? 1 : (id(relay2).state ? 2 : (id(relay3).state ? 3 : 0));
          id(speed_was) = was;
          if (was == want) {
            id(relay_event).execute(std::string("speed ") + to_string(want) + " again - ignored");
            return;
          }
          if (was == 1) id(relay1).turn_off();
          if (was == 2) id(relay2).turn_off();
          if (was == 3) id(relay3).turn_off();
      - if:
          condition:
            lambda: 'return id(speed_was) != want && id(speed_was) != 0 && want != 0;'
          then:
            - delay: 300ms        # motor winding protection: old winding drops out before the next closes
      - lambda: |-
          if (id(speed_was) == want) return;
          if (want == 1) id(relay1).turn_on();
          if (want == 2) id(relay2).turn_on();
          if (want == 3) id(relay3).turn_on();
          if (want == 0) { id(rgb_led).turn_off().perform(); return; }
          auto call = id(rgb_led).turn_on();
          call.set_brightness(0.8f);
          if (want == 1) call.set_rgb(0.0f, 0.0f, 1.0f);
          if (want == 2) call.set_rgb(0.0f, 1.0f, 1.0f);
          if (want == 3) call.set_rgb(0.0f, 1.0f, 0.0f);
          call.perform();

  - id: relay_event
    mode: queued
    max_runs: 10
    parameters:
      what: string
    then:
      - lambda: |-
          // last 4 events in one state: the API only sends the newest state when several land within ~100 ms
          uint32_t now = millis(), gap = id(last_event_ms) ? now - id(last_event_ms) : 0;
          id(last_event_ms) = now;
          char buf[64];
          auto t = id(homeassistant_time).now();
          if (gap == 0 || gap > 10000) {   // a new burst leads with the clock
            if (t.is_valid()) snprintf(buf, sizeof(buf), "%02d:%02d:%02d %s", t.hour, t.minute, t.second, what.c_str());
            else snprintf(buf, sizeof(buf), "%s", what.c_str());
          } else {
            snprintf(buf, sizeof(buf), "%s +%u ms", what.c_str(), (unsigned) gap);
          }
          ESP_LOGI("hood", "%s", buf);
          static std::vector<std::string> last;
          last.push_back(buf);
          if (last.size() > 4) last.erase(last.begin());
          std::string out;
          for (size_t k = 0; k < last.size(); k++) { if (k) out += " | "; out += last[k]; }
          id(relay_events).publish_state(out);
