# =======================================================
# LD2450-PRESENCE - radar block of NU-Presence-24GHz-2 v1.13 as a package.
# GENERATED by make_package.py from nu-presence-24ghz-2.yaml: change that file and rebuild this
# one, do not edit here. Needs presence_2450.h + radar_web_2450.h next to the device yaml,
# substitutions radar_tx_pin / radar_rx_pin, a script "presence_changed" and the
# esp_http_server IDF component in the device yaml.
# What each entity means: see the header of nu-presence-24ghz-2.yaml.
# =======================================================
esphome:
  includes:
    - presence_2450.h           # still presence tracks
    - radar_web_2450.h          # tuning page on :8080
  on_boot:
    - priority: -100
      then:
        - lambda: 'presence_restore(millis());'
        - globals.set:
            id: boot_done
            value: 'true'
        - script.execute: presence_changed

globals:
  - id: boot_done
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: rx_bytes
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_rx_ms              # last radar bytes; without them the driver's sensors are frozen, not live
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_move_ms            # last moment an in-range target was really moving
    type: uint32_t
    restore_value: no
    initial_value: '0'

uart:
  id: uart_bus
  tx_pin: ${radar_tx_pin}
  rx_pin: ${radar_rx_pin}
  rx_buffer_size: 1024
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  debug:                        # counts RX bytes; the component still gets them
    direction: RX
    dummy_receiver: false
    after:
      timeout: 50ms
    sequence:
      - lambda: |-
          id(rx_bytes) += bytes.size();
          id(last_rx_ms) = millis();

ld2450:
  id: radar
  uart_id: uart_bus
  link_timeout: 5s   # v1.12 (ESPHome 2026.11): no valid frame for 5 s = Radar Link off

interval:
  - interval: 5s
    then:
      - lambda: |-
          id(radar_bps).publish_state(id(rx_bytes) / 5.0f);
          id(rx_bytes) = 0;
  # v1.10: published only when they change
  - interval: 1s
    then:
      - lambda: |-
          const char *sp = rw_still_preset(id(still_hold).state);
          const char *mp = rw_move_preset(id(mv_speed).state, id(mv_hold).state);
          const char *wp = radar_web_state();
          if (id(still_preset).state != sp) id(still_preset).publish_state(sp);
          if (id(moving_preset).state != mp) id(moving_preset).publish_state(mp);
          if (id(web_page).state != wp) id(web_page).publish_state(wp);
  # writes that came in over :8080 are performed here, on the main loop (doing them on the httpd task crashed 24GHz-1)
  - interval: 100ms
    then:
      - lambda: 'radar_web_pump();'
      # v1.8: raw radar slots (mm, cm/s, NaN when empty) into the presence tracks
      - lambda: |-
          if (!id(boot_done)) return;
          float x[3] = {id(t1x).get_raw_state(), id(t2x).get_raw_state(), id(t3x).get_raw_state()};
          float y[3] = {id(t1y).get_raw_state(), id(t2y).get_raw_state(), id(t3y).get_raw_state()};
          float s[3] = {id(t1s).get_raw_state(), id(t2s).get_raw_state(), id(t3s).get_raw_state()};
          float cd = id(n_timeout).state, sh = id(still_hold).state;
          float igl = id(ign_from).state, igh = id(ign_to).state;
          // v1.13: room plan + zones for the tracker (presence_2450.h v1.3): room fence, exits at the edge, zone hysteresis
          { float rw = 0, rd = 0, rsx = 0, rsy = 0, raim = 0; bool rfl = false, rfence = true;
            bool ron = rw_room_geom(rw, rd, rsx, rsy, raim, rfl, rfence);
            presence_room(ron, rfence, rw, rd, rsx, rsy, raim, rfl);
            float zz[3][4] = {{id(z1x1).state, id(z1y1).state, id(z1x2).state, id(z1y2).state}, {id(z2x1).state, id(z2y1).state, id(z2x2).state, id(z2y2).state},
                              {id(z3x1).state, id(z3y1).state, id(z3x2).state, id(z3y2).state}};
            presence_zones(rw_zt < 0 ? 0 : rw_zt, zz); }
          presence_tick(x, y, s, millis() - id(last_rx_ms) < PR_SILENT_MS, id(mv_range).state * 1000.0f, id(mv_speed).state,
                        (uint32_t) ((std::isnan(cd) ? 30.0f : cd) * 1000.0f), (uint32_t) ((std::isnan(sh) ? 300.0f : sh) * 1000.0f), millis(),
                        std::isnan(igl) ? 0.0f : igl * 1000.0f, std::isnan(igh) ? 0.0f : igh * 1000.0f);
  # hand the entities to radar_web_2450.h and start the httpd (returns at once when it is already running)
  - interval: 10s
    then:
      - lambda: |-
          auto &c = radar_web_cfg();
          c.occ = id(occupied); c.mv = id(bs_mv); c.st = id(bs_st);
          c.zn[0] = id(zn1); c.zn[1] = id(zn2); c.zn[2] = id(zn3);
          c.tx[0] = id(t1x); c.ty[0] = id(t1y); c.ts[0] = id(t1s);
          c.tx[1] = id(t2x); c.ty[1] = id(t2y); c.ts[1] = id(t2s);
          c.tx[2] = id(t3x); c.ty[2] = id(t3y); c.ts[2] = id(t3s);
          c.count = id(t_count);
          c.zc[0][0] = id(z1x1); c.zc[0][1] = id(z1y1); c.zc[0][2] = id(z1x2); c.zc[0][3] = id(z1y2);
          c.zc[1][0] = id(z2x1); c.zc[1][1] = id(z2y1); c.zc[1][2] = id(z2x2); c.zc[1][3] = id(z2y2);
          c.zc[2][0] = id(z3x1); c.zc[2][1] = id(z3y1); c.zc[2][2] = id(z3x2); c.zc[2][3] = id(z3y2);
          c.timeout = id(n_timeout); c.hold = id(zone_hold);
          c.mvs = id(mv_speed); c.mvr = id(mv_range); c.mvh = id(mv_hold); c.mvraw = id(bs_mv_raw);
          c.sth = id(still_hold); c.occraw = id(occ_raw); c.igf = id(ign_from); c.igt = id(ign_to);
          c.multi = id(sw_multi); c.zt = id(sel_zt); c.fw = id(ts_fw); c.uptime = id(s_uptime); c.rssi = id(s_rssi);
          rw_room_default = R"(${radar_room_default})";   // room map default: substitution radar_room_default in the device yaml
          radar_web_register();

binary_sensor:
  - platform: ld2450
    ld2450_id: radar
    has_target:
      id: occ_raw
      internal: true
    has_moving_target:
      id: bs_mv_raw
      internal: true
    # v1.12: on while the LD2450 sends valid frames; off = radar module silent (not an empty room)
    connected:
      id: bs_link
      name: "Radar Link"

  - platform: template
    id: occupied
    name: "Occupied"
    device_class: occupancy
    lambda: 'return presence_occupied();'
    on_state:
      - script.execute: presence_changed
  - platform: template
    id: bs_st
    name: "Still target"
    icon: mdi:human-male
    lambda: 'return id(occupied).state && !id(bs_mv).state;'

  # Moving target: raw speed (cm/s) and forward distance (mm) per slot, NaN when empty. Evaluated every loop.
  - platform: template
    id: bs_mv
    name: "Moving target"
    device_class: motion
    lambda: |-
      esphome::sensor::Sensor *sp[3] = {id(t1s), id(t2s), id(t3s)};
      esphome::sensor::Sensor *fy[3] = {id(t1y), id(t2y), id(t3y)};
      esphome::sensor::Sensor *fx[3] = {id(t1x), id(t2x), id(t3x)};   // presence_2450.h v1.6: not a flicker at a still-clutter spot
      float ymax = id(mv_range).state * 1000.0f, smin = id(mv_speed).state;
      bool live = millis() - id(last_rx_ms) < PR_SILENT_MS;   // silent radar: last speed is frozen, not movement
      for (int i = 0; live && i < 3; i++) {
        float v = sp[i]->get_raw_state(), y = fy[i]->get_raw_state();
        if (!std::isnan(v) && !std::isnan(y) && y <= ymax && fabsf(v) >= smin && presence_move_ok(fx[i]->get_raw_state(), y)) id(last_move_ms) = millis();
      }
      return id(last_move_ms) != 0 && (float) (millis() - id(last_move_ms)) < id(mv_hold).state * 1000.0f;
    on_state:
      - script.execute: presence_changed

  - platform: template
    id: zn1
    name: "Zone 1"
    device_class: occupancy
    lambda: 'return presence_in_rect(0, id(z1x1).state, id(z1y1).state, id(z1x2).state, id(z1y2).state);'
    filters:
      - delayed_off: !lambda return (uint32_t)(id(zone_hold).state * 1000.0f);
  - platform: template
    id: zn2
    name: "Zone 2"
    device_class: occupancy
    lambda: 'return presence_in_rect(1, id(z2x1).state, id(z2y1).state, id(z2x2).state, id(z2y2).state);'
    filters:
      - delayed_off: !lambda return (uint32_t)(id(zone_hold).state * 1000.0f);
  - platform: template
    id: zn3
    name: "Zone 3"
    device_class: occupancy
    lambda: 'return presence_in_rect(2, id(z3x1).state, id(z3y1).state, id(z3x2).state, id(z3y2).state);'
    filters:
      - delayed_off: !lambda return (uint32_t)(id(zone_hold).state * 1000.0f);

sensor:
  - platform: ld2450
    ld2450_id: radar
    target_count:
      id: t_count
      name: "Target count"
      filters:
        - throttle: 1s
        - delta: 0.5
    # the driver publishes mm at ~10 Hz and NaN for an empty slot (page reads raw); HA gets metres, empty = 0.0
    target_1:
      x: {id: t1x, name: "Target 1 X", unit_of_measurement: "m", device_class: "", accuracy_decimals: 2, disabled_by_default: true, filters: [{lambda: 'return std::isnan(x) ? 0.0f : x;'}, {multiply: 0.001}, {heartbeat: 500ms}, {throttle_average: 2s}, {delta: 0.1}]}
      y: {id: t1y, name: "Target 1 Y", unit_of_measurement: "m", device_class: "", accuracy_decimals: 2, disabled_by_default: true, filters: [{lambda: 'return std::isnan(x) ? 0.0f : x;'}, {multiply: 0.001}, {heartbeat: 500ms}, {throttle_average: 2s}, {delta: 0.1}]}
      distance: {name: "Target 1 distance", unit_of_measurement: "m", device_class: "", accuracy_decimals: 2, filters: [{lambda: 'return std::isnan(x) ? 0.0f : x;'}, {multiply: 0.001}, {heartbeat: 500ms}, {throttle_average: 2s}, {delta: 0.1}]}
      speed: {id: t1s, internal: true}
    target_2:
      x: {id: t2x, name: "Target 2 X", unit_of_measurement: "m", device_class: "", accuracy_decimals: 2, disabled_by_default: true, filters: [{lambda: 'return std::isnan(x) ? 0.0f : x;'}, {multiply: 0.001}, {heartbeat: 500ms}, {throttle_average: 2s}, {delta: 0.1}]}
      y: {id: t2y, name: "Target 2 Y", unit_of_measurement: "m", device_class: "", accuracy_decimals: 2, disabled_by_default: true, filters: [{lambda: 'return std::isnan(x) ? 0.0f : x;'}, {multiply: 0.001}, {heartbeat: 500ms}, {throttle_average: 2s}, {delta: 0.1}]}
      distance: {name: "Target 2 distance", unit_of_measurement: "m", device_class: "", accuracy_decimals: 2, filters: [{lambda: 'return std::isnan(x) ? 0.0f : x;'}, {multiply: 0.001}, {heartbeat: 500ms}, {throttle_average: 2s}, {delta: 0.1}]}
      speed: {id: t2s, internal: true}
    target_3:
      x: {id: t3x, name: "Target 3 X", unit_of_measurement: "m", device_class: "", accuracy_decimals: 2, disabled_by_default: true, filters: [{lambda: 'return std::isnan(x) ? 0.0f : x;'}, {multiply: 0.001}, {heartbeat: 500ms}, {throttle_average: 2s}, {delta: 0.1}]}
      y: {id: t3y, name: "Target 3 Y", unit_of_measurement: "m", device_class: "", accuracy_decimals: 2, disabled_by_default: true, filters: [{lambda: 'return std::isnan(x) ? 0.0f : x;'}, {multiply: 0.001}, {heartbeat: 500ms}, {throttle_average: 2s}, {delta: 0.1}]}
      distance: {name: "Target 3 distance", unit_of_measurement: "m", device_class: "", accuracy_decimals: 2, filters: [{lambda: 'return std::isnan(x) ? 0.0f : x;'}, {multiply: 0.001}, {heartbeat: 500ms}, {throttle_average: 2s}, {delta: 0.1}]}
      speed: {id: t3s, internal: true}

  - platform: template
    id: radar_bps
    name: "Radar byte rate"
    icon: mdi:swap-horizontal
    unit_of_measurement: "B/s"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    filters:
      - throttle: 60s

  - platform: wifi_signal
    id: s_rssi
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    id: s_uptime
    name: "Uptime"
    update_interval: 60s
    entity_category: diagnostic
number:
  - platform: ld2450
    ld2450_id: radar
    presence_timeout:
      id: n_timeout
      name: "Clear delay"
    # millimetres: internal on purpose, edited in metres on the tuning page
    zone_1:
      x1: {id: z1x1, internal: true}
      y1: {id: z1y1, internal: true}
      x2: {id: z1x2, internal: true}
      y2: {id: z1y2, internal: true}
    zone_2:
      x1: {id: z2x1, internal: true}
      y1: {id: z2y1, internal: true}
      x2: {id: z2x2, internal: true}
      y2: {id: z2y2, internal: true}
    zone_3:
