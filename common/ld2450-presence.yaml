      y1: {id: z3y1, internal: true}
      x2: {id: z3x2, internal: true}
      y2: {id: z3y2, internal: true}
  - platform: template
    id: z1x1m
    name: "Zone 1 X1"
    icon: mdi:vector-rectangle
    unit_of_measurement: "m"
    min_value: -4.86
    max_value: 4.86
    step: 0.01
    mode: box
    entity_category: config
    update_interval: 5s
    lambda: |-
      float v = id(z1x1).state;
      if (std::isnan(v)) return {};
      return v / 1000.0f;
    set_action:
