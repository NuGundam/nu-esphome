packages:
  wifi_diag: !include common/wifi-diag.yaml   # BSSID / Access Point / reconnects / TX power (2026-11-07)

esphome:
  name: nu-wt-1
  friendly_name: NU-WT-1

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 20.0dB
  fast_connect: true
  reboot_timeout: 0s
  power_save_mode: NONE
  ap:
    ssid: "NU-WT-1 Fallback"
    password: !secret ap_password

captive_portal:

logger:
  baud_rate: 115200
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

sensor:
  - platform: wifi_signal
    #name: "WiFi Signal Strength"
    update_interval: 60s
    id: wifi_signal_raw
    filters:
      - delta: 1

  # Calculate signal quality as percentage
  - platform: template
    name: "WiFi Signal Quality"
    id: wifi_quality
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:wifi"
    update_interval: 60s
    lambda: |-
      int quality = 2 * (100 + id(wifi_signal_raw).state);
      if (quality > 100) {
      return 100;
      } else if (quality < 0) {
      return 0;
      } else {
      return quality;
      }
    filters:
    - delta: 1
    entity_category: "diagnostic"

  # Internal Temperature Sensor
  - platform: internal_temperature
    name: "ESP32 Internal Temperature (F)"
    id: esp_temp
    update_interval: 60s
    filters:
      - delta: 1
      - lambda: return (x * 1.8) + 32;
    unit_of_measurement: "°F"
    entity_category: "diagnostic"

 # Template Text Sensor for Threshold
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "ESP32 IP Address"
      icon: mdi:ip
    ssid:
      name: "SSID"
      icon: mdi:ip-outline

  - platform: template
    name: "Unit Temperature Status"
    id: esp_temp_status
    icon: "mdi:thermometer"
    lambda: |-
      if (id(esp_temp).state >= 185) {  // ~85°C
        return {"Overheating"};
      } else if (id(esp_temp).state >= 140) {  // ~60°C
        return {"Warm"};
      } else {
        return {"Normal"};
      }
    entity_category: "diagnostic"
    update_interval: 60s

# Configuration for water pump relays
switch:
  - platform: gpio
    pin: GPIO0
    id: water_pump_switch
    internal: true
    on_turn_on:
      - delay: 60s
      - switch.turn_off: water_pump_switch

valve:
  - platform: template
    name: "Water Pump"
    id: water_pump
    device_class: water
    open_action:
      - switch.turn_on: water_pump_switch
    close_action:
      - switch.turn_off: water_pump_switch
    lambda: |-
      if (id(water_pump_switch).state) return VALVE_OPEN;
      return VALVE_CLOSED;