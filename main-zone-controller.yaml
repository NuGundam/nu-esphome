# ─────────────────────────────────────────────────────────────
# VALVES  (machine-generated — edit the generator below, not these blocks)
#
# open_action     → target=1.0, relay OFF  → tick drives pos → 1.0
# close_action    → target=0.0, relay ON   → tick drives pos → 0.0
# position_action → target=pos, relay set by direction; tick stops at target
# stop_action     → stopped[i]=true, target snapped to current pos
#
# The tick auto-sets stopped[i]=true when pos reaches target,
# so no external stop call is needed after open/close/position.
# ─────────────────────────────────────────────────────────────
script:
  - id: damper_failsafe
    mode: restart
    then:
      - delay: 30min
      - if:
          condition:
            not:
              api.connected:
          then:
            - logger.log:
                format: "Failsafe: no Home Assistant for 30 min - opening zone dampers, closing fresh air"
                level: ERROR
            - valve.open: valve_1
            - valve.open: valve_2
            - valve.open: valve_3
            - valve.open: valve_4
            - valve.open: valve_5
            - valve.open: valve_6
            - valve.open: valve_7
            - valve.open: valve_8
            - valve.open: valve_9
            - valve.open: valve_10
            - valve.open: valve_11
            - valve.open: valve_12
            - valve.open: valve_13
            - valve.open: valve_14
            - valve.close: valve_15

valve:
  # ──  1  Bathroom 2
  - platform: template
    id: valve_1
    name: "Bathroom 2 Damper"
    device_class: gas
    open_action:
      - lambda: |-
          id(stopped)[0] = false;
          id(target_positions)[0] = 1.0f;
      - switch.turn_off: relay_1
    close_action:
      - lambda: |-
          id(stopped)[0] = false;
          id(target_positions)[0] = 0.0f;
      - switch.turn_on: relay_1
    position_action:
      - lambda: |-
          id(stopped)[0] = false;
          id(target_positions)[0] = pos;
          if (pos >= id(positions)[0])
            id(relay_1).turn_off();
          else
            id(relay_1).turn_on();
    stop_action:
      - lambda: |-
          id(stopped)[0] = true;
          id(target_positions)[0] = id(positions)[0];
          id(valve_1).current_operation = esphome::valve::VALVE_OPERATION_IDLE;
          id(valve_1).publish_state();
    lambda: return id(positions)[0];

  # ──  2  Bathroom 3
