# =============================================================================
# main-zone-controller.yaml
#
# DAMPER INDEX MAP
#   0  Bathroom 2       1  Bathroom 3       2  Office 3
#   3  Dining Room      4  Office 1      5  Family Room
#   6  Bedroom 2    7  Office 2     8  Kitchen
#   9  Laundry         10  Loft            11  Main Hallway
#  12  Master Bathroom 13  Master Bedroom  14  Fresh Air
#
# VALVE POSITION SEMANTICS
#   0.0 = fully closed   1.0 = fully open
#   relay ON  → tick drives pos toward 0.0 (closing)
#   relay OFF → tick drives pos toward 1.0 (opening)
#
# NOTE: The 15 valve blocks below are machine-generated from the rooms[]
#   table in the Python generator comment at the bottom of this file.
#   To add/rename a zone: edit ONLY the generator, then re-run it.
#   Do NOT hand-edit the valve blocks directly.
# =============================================================================

esphome:
  name: main-zone-controller
  friendly_name: main-zone-controller

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  baud_rate: 115200
  level: ERROR

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
  # failsafe: HA gone 30 min -> all zone dampers open (no closed-duct static pressure while the
  # air handler keeps running on its own thermostat) and the fresh-air damper closed
  on_client_connected:
    - script.stop: damper_failsafe
  on_client_disconnected:
    - script.execute: damper_failsafe

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 14.0dB
  fast_connect: true
  # reboot if WiFi stays down 15 min (a wedged stack otherwise never recovers)
  reboot_timeout: 15min
  power_save_mode: none        # was: light — avoid beacon-interval dropouts
  ap:
    ssid: "Main-Zone-Controller"
    password: !secret ap_password

captive_portal:

# ─────────────────────────────────────────────────────────────
# GLOBALS
#
# positions[0..14]        — current position  0.0=closed  1.0=open
# target_positions[0..14] — desired position set by open/close/position_action
# stopped[0..14]          — true = hold current position (stop_action)
#                           cleared by any open/close/position_action
# ─────────────────────────────────────────────────────────────
globals:
  - id: positions
    type: float[15]
    restore_value: no
    initial_value: "{1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f}"

  - id: target_positions
    type: float[15]
    restore_value: no
    initial_value: "{1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f,1.0f}"

  - id: stopped
    type: bool[15]
    restore_value: no
    initial_value: "{false,false,false,false,false,false,false,false,false,false,false,false,false,false,false}"

# ─────────────────────────────────────────────────────────────
# I2C / PCF8574
# ─────────────────────────────────────────────────────────────
i2c:
  sda: 4
  scl: 5
  scan: true
  id: bus_a

pcf8574:
  - id: pcf8574_hub_out_1
    address: 0x24
  - id: pcf8574_hub_out_2
    address: 0x25
  - id: pcf8574_hub_in_1
    address: 0x22
  - id: pcf8574_hub_in_2
    address: 0x23

one_wire:
  - platform: gpio
    pin: GPIO14

# ─────────────────────────────────────────────────────────────
# INTERVAL — 1 s tick drives all 15 dampers toward target_positions[]
#
# Per-channel logic:
#   stopped[i]        → hold, do nothing
#   relay ON  → closing  (pos → 0.0);  stop when pos ≤ target
#   relay OFF → opening  (pos → 1.0);  stop when pos ≥ target
#
# Reaching the target auto-sets stopped[i]=true and goes IDLE,
# exactly like an explicit stop_action.
# ─────────────────────────────────────────────────────────────
interval:
  - interval: 1s
    id: damper_tick
    then:
      - lambda: |-
          using VS = esphome::valve::ValveOperation;

          auto tick = [](
              esphome::switch_::Switch *relay,
              esphome::valve::Valve    *valve,
              float                    &pos,
              bool                     &halted,
              float                    &target)
          {
            if (halted) return;

            const float STEP = 1.0f / 30.0f;
            bool closing = relay->state;   // relay ON = damper closing

            if (closing) {
              if (pos <= 0.0f) { halted = true; return; }
              pos = max(0.0f, pos - STEP);
              valve->current_operation = VS::VALVE_OPERATION_CLOSING;
              valve->position = pos;
              if (pos <= target) {
                pos    = target;
                halted = true;
                valve->current_operation = VS::VALVE_OPERATION_IDLE;
              }
            } else {
              if (pos >= 1.0f) { halted = true; return; }
              pos = min(1.0f, pos + STEP);
              valve->current_operation = VS::VALVE_OPERATION_OPENING;
              valve->position = pos;
              if (pos >= target) {
                pos    = target;
                halted = true;
                valve->current_operation = VS::VALVE_OPERATION_IDLE;
              }
            }
            valve->publish_state();
          };

          auto &p  = id(positions);
          auto &tp = id(target_positions);
          auto &s  = id(stopped);

          tick(id(relay_1),  id(valve_1),  p[0],  s[0],  tp[0]);
          tick(id(relay_2),  id(valve_2),  p[1],  s[1],  tp[1]);
          tick(id(relay_3),  id(valve_3),  p[2],  s[2],  tp[2]);
          tick(id(relay_4),  id(valve_4),  p[3],  s[3],  tp[3]);
          tick(id(relay_5),  id(valve_5),  p[4],  s[4],  tp[4]);
          tick(id(relay_6),  id(valve_6),  p[5],  s[5],  tp[5]);
          tick(id(relay_7),  id(valve_7),  p[6],  s[6],  tp[6]);
          tick(id(relay_8),  id(valve_8),  p[7],  s[7],  tp[7]);
          tick(id(relay_9),  id(valve_9),  p[8],  s[8],  tp[8]);
          tick(id(relay_10), id(valve_10), p[9],  s[9],  tp[9]);
          tick(id(relay_11), id(valve_11), p[10], s[10], tp[10]);
          tick(id(relay_12), id(valve_12), p[11], s[11], tp[11]);
          tick(id(relay_13), id(valve_13), p[12], s[12], tp[12]);
          tick(id(relay_14), id(valve_14), p[13], s[13], tp[13]);
          tick(id(relay_15), id(valve_15), p[14], s[14], tp[14]);

# ─────────────────────────────────────────────────────────────
# SENSORS
# ─────────────────────────────────────────────────────────────
sensor:
  - platform: dallas_temp
    address: 0xe400000037d9f528
    name: "Main Duct Temperature"
    update_interval: 3s
    filters:
      - offset: -1.66
      - delta: 0.5

  - platform: wifi_signal
    update_interval: 60s
    id: wifi_signal_raw
    filters:
      - delta: 1

  - platform: template
    name: "WiFi Signal Quality"
    id: wifi_quality
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:wifi"
    update_interval: 60s
    lambda: |-
      if (isnan(id(wifi_signal_raw).state)) return {};
      int quality = 2 * (100 + (int) id(wifi_signal_raw).state);
      if (quality > 100) return 100;
      else if (quality < 0) return 0;
      else return quality;
    filters:
      - delta: 1
    entity_category: "diagnostic"

  - platform: internal_temperature
    name: "ESP32 Internal Temperature (F)"
    id: esp_temp
    update_interval: 60s
    filters:
      - delta: 1
      - lambda: return (x * 1.8) + 32;
    unit_of_measurement: "°F"
    entity_category: "diagnostic"

  - platform: uptime
    name: Uptime
    id: sys_uptime
    update_interval: 60s
    entity_category: "diagnostic"

# ─────────────────────────────────────────────────────────────
# TEXT SENSORS
# ─────────────────────────────────────────────────────────────
text_sensor:
  - platform: wifi_info
    ip_address:
      name: "ESP32 IP Address"
      icon: mdi:ip
    ssid:
      name: "SSID"
      icon: mdi:ip-outline

  - platform: template
    name: "Unit Temperature Status"
    id: esp_temp_status
    icon: "mdi:thermometer"
    lambda: |-
      if (id(esp_temp).state >= 185)      return {"Overheating"};
      else if (id(esp_temp).state >= 140) return {"Warm"};
      else                                return {"Normal"};
    entity_category: "diagnostic"
    update_interval: 60s

