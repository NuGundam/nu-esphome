# =======================================================
# NU-Presence-24GHz-1  v2.3 (2026-11-15) - HLK-LD2410C 24 GHz presence radar on a
# Waveshare ESP32-S3-LCD-1.47B (ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM, 172x320 ST7789 LCD).
# Moved from the Arduino Nano ESP32 (v1.13); every entity name is kept so HA keeps its entity ids.
# The board used to run "nu-esp32-s3-lcd-1" (clock / Wi-Fi screen + unused "AQI LED").
#
# Wiring (LD2410C 5-pin header -> board edge pads, Waveshare pin drawing):
#   VCC -> VBUS   (5 V from USB-C; the module wants 5 V, its UART is 3.3 V logic)
#   GND -> G      (either G pad; the one next to BAT is on the same edge as RXD/TXD)
#   TX  -> RXD    = GPIO44 (UART0 RX)
#   RX  -> TXD    = GPIO43 (UART0 TX)
#   OUT -> not connected (presence comes over UART)
# Same UART0 pins as on the Nano, so the logger stays on the native USB port.
#
# On-board parts used (Waveshare wiki + the old nu-esp32-s3-lcd-1.yaml):
#   LCD SPI SCLK 40 / MOSI 45, CS 42, DC 41, RST 39, backlight PWM 46
#   RGB LED (WS2812-type) GPIO38 - sits under the display; its light leaves through
#     the clear acrylic spacer between PCB and LCD, i.e. around the board edge.
#   BOOT button GPIO0 - after boot: short press = next screen page + wakes the screen.
#   microSD 14-18/21 and the QMI8658 IMU are not used.
#
# New in v2.0 (beside everything v1.13 had):
#   * Screen pages: Presence (MOVING / STILL / CLEAR banner, target distance, move/still
#     energy bars with their distances, Zone A/B chips, clear delay, byte rate),
#     Gates (9 rings: move/still energy bars with threshold ticks, needs Engineering mode),
#     Status (Wi-Fi, AP, IP, uptime, radar fw, MCU temp, clock). Select "Display page"
#     (Presence / Gates / Status / Cycle) or the BOOT button.
#   * "LCD Backlight" light (brightness), "Screen off when clear" switch + "Screen off delay".
#   * Presence LED: blue = moving, green = still only, off (or a dim white "Presence LED
#     clear glow") when clear. "Presence LED" switch is the off switch (now on by default),
#     "Presence LED brightness" scales it. The "LED" light entity is the raw LED.
# v2.1 (2026-11-15): defaults after boot - Engineering mode turned on at 25 s (again at ~75 s if off) and
#   Radar Bluetooth turned off at ~65 s when the settings query reports it on (that write restarts the radar,
#   so it is skipped once BT is already off). The move to this board had left the module on factory settings.
# v2.2 (2026-11-15): "24-hour clock" switch for the Presence and Status page clocks; off (default) = 12-hour AM/PM.
# v2.3 (2026-11-15): "Screen orientation" select. Portrait (USB down) = the v2 case (board upright, radar on top):
#   rotation 180 and portrait pages (172 x 320). Landscape (USB left) = the v1 case and the old pages (default).
# =======================================================
substitutions:
  device_name: nu-presence-24ghz-1
  portrait_rotation: "180"     # v2.3: USB-C down; if the portrait picture is upside down use "0"
  friendly_name: Nu-Presence-24GHz-1
  api_key: !secret api_key
  ap_ssid: "Nu-Presence-24GHz-1 Hotspot"
  ap_password: !secret ap_password
  led_order: RGB        # WS2812 colour order; if moving shows red instead of blue, try GRB

packages:
  wifi_diag: !include common/wifi-diag.yaml   # BSSID / Access Point / reconnects / TX power (2026-11-07)
  wifi_steer: !include common/wifi-steer.yaml   # keep on the strongest mesh node (2026-11-19)

# Keeps _esphomelib in mDNS next to the _http service from the USE_WEBSERVER flags (2026-11-07).
external_components:
  - source:
      type: local
      path: components
    components: [mdns_web_slot]
mdns_web_slot:

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  includes:
    - radar_web.h               # tuning page on :8080
  platformio_options:
    build_flags:
      - "-DUSE_WEBSERVER"
      - "-DUSE_WEBSERVER_PORT=8080"
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(my_display).set_rotation(id(sel_orient).active_index().value_or(0) == 1   // v2.3
                ? display::DISPLAY_ROTATION_${portrait_rotation}_DEGREES : display::DISPLAY_ROTATION_90_DEGREES);
            esphome::number::Number *zs[] = {id(zone_a_near), id(zone_a_far), id(zone_b_near), id(zone_b_far), id(zone_edge)};
            for (auto *n : zs)
              if (n->has_state() && n->state > n->traits.get_max_value()) n->make_call().set_value(n->state / 100.0f).perform();
            id(last_occ_ms) = millis();
        - script.execute: led_update
        # the radar boots slower than the ESP: ask for its settings once it is surely up (20 s did not always take
        # on NU-Garage-1, so ask again at 60 s)
        - delay: 20s
        - button.press: btn_query
        - delay: 5s
        - switch.turn_on: sw_eng        # v2.1: Engineering mode on by default (the module forgets it on a restart)
        - delay: 35s
        - button.press: btn_query
        # v2.1: Radar Bluetooth off by default. It is saved in the module and turning it off restarts the
        # radar, so only send it when the query says it is on (no flash write / restart on normal boots).
        - delay: 5s
        - if:
            condition:
              switch.is_on: sw_bt
            then:
              - switch.turn_off: sw_bt
              - delay: 10s
              - button.press: btn_query
        # the radar restart above (or a lost command) clears Engineering mode: turn it on once more
        - delay: 5s
        - if:
            condition:
              switch.is_off: sw_eng
            then:
              - switch.turn_on: sw_eng

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 160MHz         # 80 MHz was plenty for the radar alone; the LCD redraw wants more
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:   # radar_web.h runs its own httpd
        - esp_http_server
    sdkconfig_options:
      CONFIG_LWIP_MAX_SOCKETS: "16"     # API + OTA + mDNS + 5 httpd sockets

psram:
  mode: octal                   # ESP32-S3R8
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG   # UART0 pins (GPIO43/44) belong to the radar
  level: INFO
  logs:
    ld2410: WARN

api:
  encryption:
    key: ${api_key}
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 15min
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}

time:
  - platform: homeassistant
    id: home_time

debug:
  update_interval: 60s

# -------------------------------------------------------
# RADAR (unchanged from v1.13 apart from the raw-value globals the screen reads)
# -------------------------------------------------------
uart:
  id: uart_bus
  tx_pin: GPIO43
  rx_pin: GPIO44
  baud_rate: 256000
  parity: NONE
  stop_bits: 1
  debug:
    direction: RX
    dummy_receiver: false
    after:
      timeout: 50ms
    sequence:
      - lambda: |-
          id(rx_bytes) += bytes.size();

globals:
  - id: rx_bytes
    type: int
    restore_value: no
    initial_value: '0'
  - id: raw_dist                  # last target distance (cm) straight from the radar
    type: float
    restore_value: no
    initial_value: '0'
  - id: raw_mdist                 # v2.0: unfiltered values for the screen
    type: float
    restore_value: no
    initial_value: '0'
  - id: raw_sdist
    type: float
    restore_value: no
    initial_value: '0'
  - id: raw_men
    type: float
    restore_value: no
    initial_value: '0'
  - id: raw_sen
    type: float
    restore_value: no
    initial_value: '0'
  - id: cur_page                  # 0 Presence, 1 Gates, 2 Status
    type: int
    restore_value: no
    initial_value: '0'
  - id: last_occ_ms               # last time the radar reported a target (screen-off timer)
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: last_btn_ms               # BOOT press keeps the screen awake 30 s
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: screen_dark               # true while the screen-off policy has turned the backlight off
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 5s
    then:
      - lambda: |-
          id(radar_bps).publish_state(id(rx_bytes) / 5.0f);
          id(rx_bytes) = 0;
  # writes that came in over :8080 are performed here, on the main loop (never on the httpd task)
  - interval: 100ms
    then:
      - lambda: 'radar_web_pump();'
  - interval: 10s
    then:
      - lambda: |-
          auto &c = radar_web_cfg();
          c.dist = id(t_dist); c.mdist = id(m_dist); c.sdist = id(s_dist); c.men = id(m_en); c.sen = id(s_en);
          c.occ = id(occupied); c.mv = id(bs_mv); c.st = id(bs_st); c.za = id(zone_a); c.zb = id(zone_b);
          c.a_near = id(zone_a_near); c.a_far = id(zone_a_far); c.b_near = id(zone_b_near); c.b_far = id(zone_b_far);
          c.edge = id(zone_edge); c.hold = id(zone_hold); c.maxm = id(n_maxm); c.maxs = id(n_maxs); c.timeout = id(n_timeout);
          c.eng = id(sw_eng); c.res = id(sel_res); c.fw = id(ts_fw); c.uptime = id(s_uptime); c.rssi = id(s_rssi); c.query = id(btn_query);
          esphome::sensor::Sensor *gm[9] = {id(gme0), id(gme1), id(gme2), id(gme3), id(gme4), id(gme5), id(gme6), id(gme7), id(gme8)};
          esphome::sensor::Sensor *gs[9] = {id(gse0), id(gse1), id(gse2), id(gse3), id(gse4), id(gse5), id(gse6), id(gse7), id(gse8)};
          esphome::number::Number *gmt[9] = {id(gmt0), id(gmt1), id(gmt2), id(gmt3), id(gmt4), id(gmt5), id(gmt6), id(gmt7), id(gmt8)};
          esphome::number::Number *gst[9] = {id(gst0), id(gst1), id(gst2), id(gst3), id(gst4), id(gst5), id(gst6), id(gst7), id(gst8)};
          for (int i = 0; i < 9; i++) { c.gm[i] = gm[i]; c.gs[i] = gs[i]; c.gmt[i] = gmt[i]; c.gst[i] = gst[i]; }
          radar_web_register();
  # v2.0 screen: page cycling, screen-off policy, redraw (skipped while dark)
  - interval: 8s
    then:
      - lambda: |-
          if (id(sel_page).current_option() == "Cycle" && millis() - id(last_btn_ms) > 30000) id(cur_page) = (id(cur_page) + 1) % 3;
  - interval: 1s
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (id(occupied).state) id(last_occ_ms) = now;
          bool want_dark = id(sw_screen_auto).state
              && !id(occupied).state
              && now - id(last_occ_ms) > (uint32_t)(id(n_screen_delay).state * 1000.0f)
              && now - id(last_btn_ms) > 30000;
          if (want_dark && !id(screen_dark)) {
            id(screen_dark) = true;
            auto call = id(lcd_backlight).turn_off(); call.perform();
          } else if (!want_dark && id(screen_dark)) {
            id(screen_dark) = false;
            auto call = id(lcd_backlight).turn_on(); call.perform();   // back to the last brightness
          }
  - interval: 500ms
    then:
      - lambda: 'if (!id(screen_dark)) id(my_display).update();'

ld2410:
  id: radar
  uart_id: uart_bus

binary_sensor:
  - platform: ld2410
    has_target:
      id: occupied
      name: "Occupied"
      device_class: occupancy
      on_state:
        - script.execute: led_update
        - lambda: 'id(last_occ_ms) = millis();'
    has_moving_target:
      id: bs_mv
      name: "Moving target"
      device_class: motion
      on_state:
        - script.execute: led_update
    has_still_target:
      id: bs_st
      name: "Still target"
      icon: mdi:human-male

  - platform: template
    id: zone_a
    name: "Zone A"
    device_class: occupancy
    lambda: |-
      if (!id(occupied).state) return false;
      const float d = id(raw_dist) / 100.0f, h = id(zone_a).state ? id(zone_edge).state : 0.0f;
      return d >= id(zone_a_near).state - h && d <= id(zone_a_far).state + h;
    filters:
      - delayed_off: !lambda return (uint32_t)(id(zone_hold).state * 1000.0f);
  - platform: template
    id: zone_b
    name: "Zone B"
    device_class: occupancy
    lambda: |-
      if (!id(occupied).state) return false;
      const float d = id(raw_dist) / 100.0f, h = id(zone_b).state ? id(zone_edge).state : 0.0f;
      return d >= id(zone_b_near).state - h && d <= id(zone_b_far).state + h;
    filters:
      - delayed_off: !lambda return (uint32_t)(id(zone_hold).state * 1000.0f);

  # v2.0 BOOT button (GPIO0, pressed = low). Strapping pin: only read after boot, never driven.
  - platform: gpio
    id: boot_btn
    internal: true
    pin:
      number: GPIO0
      inverted: true
      mode:
        input: true
        pullup: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 30ms
    on_press:
      - lambda: |-
          // screen off: the first press only wakes it; screen on: next page
          if (!id(screen_dark)) id(cur_page) = (id(cur_page) + 1) % 3;
          id(last_btn_ms) = millis();

sensor:
  - platform: ld2410
    detection_distance:
      id: t_dist
      name: "Target distance"
      on_raw_value:
        - lambda: 'id(raw_dist) = x;'
      filters:
        - throttle_average: 2s
        - delta: 10
    moving_distance:
      id: m_dist
      name: "Moving distance"
      on_raw_value:
        - lambda: 'id(raw_mdist) = x;'
      filters:
        - throttle_average: 2s
        - delta: 10
    still_distance:
      id: s_dist
      name: "Still distance"
      on_raw_value:
        - lambda: 'id(raw_sdist) = x;'
      filters:
        - throttle_average: 2s
        - delta: 10
    moving_energy:
      id: m_en
      name: "Moving energy"
      on_raw_value:
        - lambda: 'id(raw_men) = x;'
      filters:
        - throttle_average: 5s
        - delta: 5
    still_energy:
      id: s_en
      name: "Still energy"
      on_raw_value:
        - lambda: 'id(raw_sen) = x;'
      filters:
        - throttle_average: 5s
        - delta: 5
    light:
      name: "Light level"
      icon: mdi:brightness-5
      filters:
        - throttle_average: 10s
        - delta: 5
    g0:
      move_energy:
        id: gme0
        name: "Gate 0 move energy"
        filters: [throttle_average: 2s, delta: 2]
      still_energy:
        id: gse0
        name: "Gate 0 still energy"
        filters: [throttle_average: 2s, delta: 2]
    g1:
      move_energy:
        id: gme1
        name: "Gate 1 move energy"
        filters: [throttle_average: 2s, delta: 2]
      still_energy:
        id: gse1
        name: "Gate 1 still energy"
        filters: [throttle_average: 2s, delta: 2]
    g2:
      move_energy:
        id: gme2
        name: "Gate 2 move energy"
        filters: [throttle_average: 2s, delta: 2]
      still_energy:
        id: gse2
        name: "Gate 2 still energy"
        filters: [throttle_average: 2s, delta: 2]
    g3:
      move_energy:
        id: gme3
        name: "Gate 3 move energy"
        filters: [throttle_average: 2s, delta: 2]
      still_energy:
        id: gse3
        name: "Gate 3 still energy"
        filters: [throttle_average: 2s, delta: 2]
    g4:
      move_energy:
        id: gme4
        name: "Gate 4 move energy"
        filters: [throttle_average: 2s, delta: 2]
      still_energy:
        id: gse4
        name: "Gate 4 still energy"
        filters: [throttle_average: 2s, delta: 2]
    g5:
      move_energy:
        id: gme5
        name: "Gate 5 move energy"
        filters: [throttle_average: 2s, delta: 2]
      still_energy:
        id: gse5
        name: "Gate 5 still energy"
        filters: [throttle_average: 2s, delta: 2]
    g6:
      move_energy:
        id: gme6
        name: "Gate 6 move energy"
        filters: [throttle_average: 2s, delta: 2]
      still_energy:
        id: gse6
        name: "Gate 6 still energy"
        filters: [throttle_average: 2s, delta: 2]
    g7:
      move_energy:
        id: gme7
        name: "Gate 7 move energy"
        filters: [throttle_average: 2s, delta: 2]
      still_energy:
        id: gse7
        name: "Gate 7 still energy"
        filters: [throttle_average: 2s, delta: 2]
    g8:
      move_energy:
        id: gme8
        name: "Gate 8 move energy"
        filters: [throttle_average: 2s, delta: 2]
      still_energy:
        id: gse8
        name: "Gate 8 still energy"
        filters: [throttle_average: 2s, delta: 2]

  - platform: template
    id: radar_bps
    name: "Radar byte rate"
    icon: mdi:serial-port
    unit_of_measurement: "B/s"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
    filters:
      - delta: 5

  - platform: wifi_signal
    id: s_rssi
    name: "WiFi RSSI"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    id: s_uptime
    name: "Uptime"
    entity_category: diagnostic
  - platform: internal_temperature
    id: s_mcu
    name: "MCU temperature"
    entity_category: diagnostic

# -------------------------------------------------------
# TUNING (written to the module, survive its reboots)
# -------------------------------------------------------
number:
  - platform: ld2410
    timeout:
      id: n_timeout
      name: "Clear delay"
      icon: mdi:timer-sand
    light_threshold:
      name: "Light threshold"
    max_move_distance_gate:
      id: n_maxm
      name: "Max moving gate"
      icon: mdi:ruler
    max_still_distance_gate:
      id: n_maxs
      name: "Max still gate"
      icon: mdi:ruler
    g0:
      move_threshold:
        id: gmt0
        name: "Gate 0 (0-0.75 m) move"
      still_threshold:
        id: gst0
        name: "Gate 0 (0-0.75 m) still"
    g1:
      move_threshold:
        id: gmt1
        name: "Gate 1 (0.75-1.5 m) move"
      still_threshold:
        id: gst1
        name: "Gate 1 (0.75-1.5 m) still"
    g2:
      move_threshold:
        id: gmt2
        name: "Gate 2 (1.5-2.25 m) move"
      still_threshold:
        id: gst2
        name: "Gate 2 (1.5-2.25 m) still"
    g3:
      move_threshold:
        id: gmt3
        name: "Gate 3 (2.25-3 m) move"
      still_threshold:
        id: gst3
        name: "Gate 3 (2.25-3 m) still"
    g4:
      move_threshold:
        id: gmt4
        name: "Gate 4 (3-3.75 m) move"
      still_threshold:
        id: gst4
        name: "Gate 4 (3-3.75 m) still"
    g5:
      move_threshold:
        id: gmt5
        name: "Gate 5 (3.75-4.5 m) move"
      still_threshold:
        id: gst5
        name: "Gate 5 (3.75-4.5 m) still"
    g6:
      move_threshold:
        id: gmt6
        name: "Gate 6 (4.5-5.25 m) move"
      still_threshold:
        id: gst6
        name: "Gate 6 (4.5-5.25 m) still"
    g7:
      move_threshold:
        id: gmt7
        name: "Gate 7 (5.25-6 m) move"
      still_threshold:
        id: gst7
        name: "Gate 7 (5.25-6 m) still"
    g8:
      move_threshold:
        id: gmt8
        name: "Gate 8 (6-6.75 m) move"
      still_threshold:
        id: gst8
        name: "Gate 8 (6-6.75 m) still"

  - platform: template
    id: zone_a_near
    name: "Zone A near"
    icon: mdi:arrow-collapse-left
    unit_of_measurement: "m"
    min_value: 0
    max_value: 6.75
    step: 0.05
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: zone_a_far
    name: "Zone A far"
    icon: mdi:arrow-collapse-right
    unit_of_measurement: "m"
    min_value: 0
    max_value: 6.75
    step: 0.05
    initial_value: 1.5
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: zone_b_near
    name: "Zone B near"
    icon: mdi:arrow-collapse-left
    unit_of_measurement: "m"
    min_value: 0
    max_value: 6.75
    step: 0.05
    initial_value: 1.5
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: zone_b_far
    name: "Zone B far"
    icon: mdi:arrow-collapse-right
    unit_of_measurement: "m"
    min_value: 0
    max_value: 6.75
    step: 0.05
    initial_value: 6.75          # v2.0: family-room value since 2026-11-06 (was 4)
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: zone_edge
    name: "Zone edge"
    icon: mdi:arrow-expand-horizontal
    unit_of_measurement: "m"
    min_value: 0
    max_value: 1
    step: 0.05
    initial_value: 0.15
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: zone_hold
    name: "Zone hold"
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 0
    max_value: 600
    step: 5
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  # v2.0 LED + screen settings (saved on the ESP)
  - platform: template
    id: n_led_bri
    name: "Presence LED brightness"
    icon: mdi:brightness-6
    unit_of_measurement: "%"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 70
    optimistic: true
    restore_value: true
    mode: slider
    entity_category: config
    on_value:
      - script.execute: led_update
  - platform: template
    id: n_led_glow
    name: "Presence LED clear glow"
    icon: mdi:lightbulb-night-outline
    unit_of_measurement: "%"
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true
    mode: slider
    entity_category: config
    on_value:
      - script.execute: led_update
  - platform: template
    id: n_screen_delay
    name: "Screen off delay"
    icon: mdi:timer-off-outline
    unit_of_measurement: "s"
    min_value: 10
    max_value: 3600
    step: 10
    initial_value: 120
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

switch:
  - platform: ld2410
    engineering_mode:
      id: sw_eng
      name: "Engineering mode"
      entity_category: config
    bluetooth:
      id: sw_bt
      name: "Radar Bluetooth"
      entity_category: config
  - platform: template
    id: presence_led
    name: "Presence LED"
    icon: mdi:led-on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON      # v2.0: on by default (it is the indicator now)
    entity_category: config
    on_turn_on:
      - script.execute: led_update
    on_turn_off:
      - script.execute: led_update
  - platform: template
    id: sw_screen_auto
    name: "Screen off when clear"
    icon: mdi:monitor-shimmer
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
  - platform: template
    id: sw_24h
    name: "24-hour clock"                 # v2.2: off = 12-hour with AM/PM
    icon: mdi:clock-digital
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config

select:
  - platform: ld2410
    distance_resolution:
      id: sel_res
      name: "Distance resolution"
      entity_category: config
    light_function:
      name: "Light function"
      entity_category: config
    out_pin_level:
      name: "OUT pin level"
      entity_category: config
  - platform: template
    id: sel_page
    name: "Display page"
    icon: mdi:monitor-dashboard
    options: [Presence, Gates, Status, Cycle]
    initial_option: Presence
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: |-
          if (x == "Presence") id(cur_page) = 0;
          else if (x == "Gates") id(cur_page) = 1;
          else if (x == "Status") id(cur_page) = 2;
  - platform: template
    id: sel_orient
    name: "Screen orientation"                # v2.3: Portrait = USB-C down (v2 case), Landscape = USB-C left (v1 case)
    icon: mdi:screen-rotation
    options: ["Landscape (USB left)", "Portrait (USB down)"]
    initial_option: "Landscape (USB left)"
    optimistic: true
    restore_value: true
    entity_category: config
    on_value:
      - lambda: |-
          id(my_display).set_rotation(i == 1 ? display::DISPLAY_ROTATION_${portrait_rotation}_DEGREES
                                             : display::DISPLAY_ROTATION_90_DEGREES);

button:
  - platform: ld2410
    factory_reset:
      name: "Radar factory reset"
      entity_category: diagnostic
    restart:
      name: "Radar restart"
      entity_category: diagnostic
    query_params:
      id: btn_query
      name: "Radar query settings"
      entity_category: diagnostic
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

text_sensor:
  - platform: ld2410
    version:
      id: ts_fw
      name: "Radar firmware"
      entity_category: diagnostic
    mac_address:
      name: "Radar MAC"
      entity_category: diagnostic

# -------------------------------------------------------
# LED - on-board RGB LED (GPIO38) under the display
# -------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "LED"
    chipset: WS2812
    pin: GPIO38
    num_leds: 1
    rgb_order: ${led_order}
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms
  - platform: monochromatic
    id: lcd_backlight
    name: "LCD Backlight"
    output: lcd_bl_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 400ms

output:
  - platform: ledc
    id: lcd_bl_output
    pin:
      number: GPIO46
      ignore_strapping_warning: true
    frequency: 20kHz

script:
  - id: led_update
    mode: restart
    then:
      - lambda: |-
          const float k = id(n_led_bri).state / 100.0f;
          if (!id(presence_led).state) {
            auto c = id(led).turn_off(); c.perform();
          } else if (id(bs_mv).state) {                // moving -> blue
            auto c = id(led).turn_on(); c.set_brightness(k); c.set_rgb(0.0f, 0.1f, 1.0f); c.perform();
          } else if (id(occupied).state) {             // still only -> green
            auto c = id(led).turn_on(); c.set_brightness(k * 0.8f); c.set_rgb(0.0f, 1.0f, 0.0f); c.perform();
          } else if (id(n_led_glow).state > 0.5f) {    // clear, dim glow
            auto c = id(led).turn_on(); c.set_brightness(id(n_led_glow).state / 100.0f); c.set_rgb(1.0f, 0.8f, 0.6f); c.perform();
          } else {
            auto c = id(led).turn_off(); c.perform();
          }

# -------------------------------------------------------
# SCREEN - 1.47" ST7789 172x320, landscape (320 x 172) or portrait (172 x 320) via "Screen orientation"
# -------------------------------------------------------
spi:
  id: bus_spi
  clk_pin: GPIO40
  mosi_pin:
    number: GPIO45
    ignore_strapping_warning: true

font:
  - file: { type: gfonts, family: Roboto, weight: 900 }
    id: f_big
    size: 34
  - file: { type: gfonts, family: Roboto, weight: 700 }
    id: f_mid
    size: 24
  - file: { type: gfonts, family: Roboto, weight: 500 }
    id: f_small
    size: 16
  - file: { type: gfonts, family: Roboto, weight: 400 }
    id: f_tiny
    size: 12

display:
  - platform: mipi_spi
    id: my_display
    model: ST7789V
    spi_id: bus_spi
    cs_pin: GPIO42
    dc_pin: GPIO41
    reset_pin: GPIO39
    dimensions:
      width: 172
      height: 320
      offset_width: 34
      offset_height: 0
    rotation: 90
    invert_colors: true
    color_order: RGB
    buffer_size: 100%
    update_interval: never         # redrawn by the 500 ms interval (skipped while the screen is off)
    lambda: |-
      const Color WHITE(255, 255, 255), GREY(130, 130, 130), DIM(55, 55, 55), BLACK(0, 0, 0);
      const Color BLUE(20, 110, 255), GREEN(0, 190, 80), AMBER(255, 170, 0), DARK(40, 40, 40);
      const bool PORT = id(sel_orient).active_index().value_or(0) == 1;   // v2.3: portrait = USB-C down (v2 case)
      const int W = PORT ? 172 : 320;
      it.fill(BLACK);
      auto clock = id(home_time).now();

      // ================= PORTRAIT (172 x 320) =================
      if (PORT) {
        const Color LINE(25, 25, 25);
        char tbuf[16] = "", tsec[16] = "";
        if (clock.is_valid()) {
          const int h12 = clock.hour % 12 == 0 ? 12 : clock.hour % 12;
          const char *ap = clock.hour < 12 ? "AM" : "PM";
          if (id(sw_24h).state) {
            snprintf(tbuf, sizeof(tbuf), "%02d:%02d", clock.hour, clock.minute);
            snprintf(tsec, sizeof(tsec), "%02d:%02d:%02d", clock.hour, clock.minute, clock.second);
          } else {
            snprintf(tbuf, sizeof(tbuf), "%d:%02d %s", h12, clock.minute, ap);
            snprintf(tsec, sizeof(tsec), "%d:%02d:%02d %s", h12, clock.minute, clock.second, ap);
          }
        }
        // ---------- page 0: presence ----------
        if (id(cur_page) == 0) {
          const bool occ = id(occupied).state, mv = id(bs_mv).state, st = id(bs_st).state;
          it.filled_rectangle(0, 0, W, 66, mv ? BLUE : (occ ? GREEN : DARK));
          it.print(W / 2, 24, id(f_big), WHITE, TextAlign::CENTER, mv ? "MOVING" : (occ ? "STILL" : "CLEAR"));
          if (tbuf[0]) it.print(W / 2, 53, id(f_small), WHITE, TextAlign::CENTER, tbuf);
          if (occ) {
            it.print(W / 2, 78, id(f_tiny), GREY, TextAlign::CENTER, "TARGET");
            it.printf(W / 2, 98, id(f_mid), WHITE, TextAlign::CENTER, "%.2f m", id(raw_dist) / 100.0f);
          } else {
            it.print(W / 2, 90, id(f_mid), GREY, TextAlign::CENTER, "No target");
          }
          const bool za = id(zone_a).state, zb = id(zone_b).state;
          if (za) it.filled_rectangle(8, 116, 74, 26, AMBER); else it.rectangle(8, 116, 74, 26, DIM);
          it.print(45, 129, id(f_small), za ? BLACK : GREY, TextAlign::CENTER, "Zone A");
          if (zb) it.filled_rectangle(90, 116, 74, 26, AMBER); else it.rectangle(90, 116, 74, 26, DIM);
          it.print(127, 129, id(f_small), zb ? BLACK : GREY, TextAlign::CENTER, "Zone B");
          auto bar = [&](int y, const char *lab, Color col, bool on, float en, float dist_cm) {
            it.printf(8, y, id(f_small), on ? col : GREY, TextAlign::CENTER_LEFT, "%s %.0f", lab, en);
            if (on) it.printf(W - 8, y, id(f_small), WHITE, TextAlign::CENTER_RIGHT, "%.2fm", dist_cm / 100.0f);
            it.rectangle(8, y + 11, W - 16, 16, DIM);
            int w = (int) (fmaxf(0.0f, fminf(100.0f, en)) * (W - 18) / 100.0f);
            if (w > 0) it.filled_rectangle(9, y + 12, w, 14, on ? col : DIM);
          };
          bar(160, "Move", BLUE, mv, mv ? id(raw_men) : 0.0f, id(raw_mdist));
          bar(204, "Still", GREEN, st, st ? id(raw_sen) : 0.0f, id(raw_sdist));
          it.line(0, 246, W, 246, DIM);
          it.printf(8, 262, id(f_tiny), GREY, TextAlign::CENTER_LEFT, "Clear delay %.0f s", id(n_timeout).state);
          it.printf(8, 280, id(f_tiny), GREY, TextAlign::CENTER_LEFT, "Max gate %.0f / %.0f", id(n_maxm).state, id(n_maxs).state);
          it.printf(8, 298, id(f_tiny), GREY, TextAlign::CENTER_LEFT, "%.0f B/s", id(radar_bps).state);
          if (!id(presence_led).state) it.print(W - 8, 298, id(f_tiny), GREY, TextAlign::CENTER_RIGHT, "LED off");

        // ---------- page 1: gates (one row per 0.75 m ring) ----------
        } else if (id(cur_page) == 1) {
          it.print(6, 4, id(f_small), WHITE, TextAlign::TOP_LEFT, "Gates");
          it.print(W - 6, 4, id(f_tiny), BLUE, TextAlign::TOP_RIGHT, "move");
          it.print(W - 6, 18, id(f_tiny), GREEN, TextAlign::TOP_RIGHT, "still");
          if (!id(sw_eng).state) {
            it.print(W / 2, 140, id(f_small), GREY, TextAlign::CENTER, "Engineering");
            it.print(W / 2, 160, id(f_small), GREY, TextAlign::CENTER, "mode is off");
            it.print(W / 2, 186, id(f_tiny), GREY, TextAlign::CENTER, "turn it on in HA to see");
            it.print(W / 2, 202, id(f_tiny), GREY, TextAlign::CENTER, "per-gate energy");
          } else {
            esphome::sensor::Sensor *gm[9] = {id(gme0), id(gme1), id(gme2), id(gme3), id(gme4), id(gme5), id(gme6), id(gme7), id(gme8)};
            esphome::sensor::Sensor *gs[9] = {id(gse0), id(gse1), id(gse2), id(gse3), id(gse4), id(gse5), id(gse6), id(gse7), id(gse8)};
            esphome::number::Number *gmt[9] = {id(gmt0), id(gmt1), id(gmt2), id(gmt3), id(gmt4), id(gmt5), id(gmt6), id(gmt7), id(gmt8)};
            esphome::number::Number *gst[9] = {id(gst0), id(gst1), id(gst2), id(gst3), id(gst4), id(gst5), id(gst6), id(gst7), id(gst8)};
            const int x0 = 22, bwid = W - 28, top = 38, rowh = 30;
            auto xv = [&](float v) { v = isnan(v) ? 0.0f : fmaxf(0.0f, fminf(100.0f, v)); return x0 + (int) (v * bwid / 100.0f); };
            int tg = -1;
            if (id(occupied).state) { tg = (int) (id(raw_dist) / 75.0f); if (tg > 8) tg = 8; }
            for (int i = 0; i < 9; i++) {
              const int y = top + i * rowh;
              const bool in_m = i <= (int) id(n_maxm).state, in_s = i <= (int) id(n_maxs).state;
              it.printf(10, y + 13, id(f_tiny), (in_m || in_s) ? WHITE : GREY, TextAlign::CENTER, "%d", i);
              int w = xv(gm[i]->state) - x0;
              if (w > 0) it.filled_rectangle(x0, y + 2, w, 11, in_m ? BLUE : DIM);
              w = xv(gs[i]->state) - x0;
              if (w > 0) it.filled_rectangle(x0, y + 14, w, 11, in_s ? GREEN : DIM);
              it.filled_rectangle(xv(gmt[i]->state) - 1, y + 1, 3, 13, WHITE);
              it.filled_rectangle(xv(gst[i]->state) - 1, y + 13, 3, 13, WHITE);
              if (i == tg) it.rectangle(1, y - 1, W - 2, rowh, AMBER);
            }
            it.line(x0 - 1, top, x0 - 1, top + 9 * rowh - 4, DIM);
            it.print(W / 2, 312, id(f_tiny), GREY, TextAlign::CENTER, "tick = threshold, 0.75 m each");
          }

        // ---------- page 2: status ----------
        } else {
          it.print(W / 2, 12, id(f_small), WHITE, TextAlign::CENTER, "Nu-Presence-24GHz-1");
          if (tsec[0]) it.print(W / 2, 44, id(f_mid), WHITE, TextAlign::CENTER, tsec);
          char ipbuf[network::IP_ADDRESS_BUFFER_SIZE] = "-";
          if (wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected())
            wifi::global_wifi_component->get_ip_addresses()[0].str_to(ipbuf);
          const float up = id(s_uptime).state;
          const int d = (int) (up / 86400), h = ((int) up % 86400) / 3600, m = ((int) up % 3600) / 60;
          char v[40];
          int y = 74;
          auto row = [&](const char *lab, const char *val) {
            it.print(6, y, id(f_tiny), GREY, TextAlign::CENTER_LEFT, lab);
            it.print(W - 6, y, id(f_small), WHITE, TextAlign::CENTER_RIGHT, val);
            it.line(6, y + 13, W - 6, y + 13, LINE);
            y += 26;
          };
          snprintf(v, sizeof(v), "%.0f dBm", id(s_rssi).state); row("Wi-Fi", v);
          row("AP", id(wd_access_point).has_state() ? id(wd_access_point).state.c_str() : "-");
          row("IP", ipbuf);
          snprintf(v, sizeof(v), "%dd %02d:%02d", d, h, m); row("Uptime", v);
          snprintf(v, sizeof(v), "%.0f B/s", id(radar_bps).state); row("Radar", v);
          row("Radar fw", id(ts_fw).has_state() ? id(ts_fw).state.c_str() : "?");
          snprintf(v, sizeof(v), "%.0f F", id(s_mcu).state * 1.8f + 32.0f); row("MCU", v);
          row("LED", id(presence_led).state ? "on" : "off");
          row("Orientation", "Portrait");
          it.print(W / 2, 310, id(f_tiny), DIM, TextAlign::CENTER, "BOOT = next page   :8080");
        }
        return;
      }

      // ================= LANDSCAPE (320 x 172, v1 case) =================

      // ---------- page 0: presence ----------
      if (id(cur_page) == 0) {
        const bool occ = id(occupied).state, mv = id(bs_mv).state, st = id(bs_st).state;
        const Color band = mv ? BLUE : (occ ? GREEN : DARK);
        it.filled_rectangle(0, 0, W, 46, band);
        it.print(10, 23, id(f_big), WHITE, TextAlign::CENTER_LEFT, mv ? "MOVING" : (occ ? "STILL" : "CLEAR"));
        if (clock.is_valid()) {
          if (id(sw_24h).state) it.strftime(W - 10, 23, id(f_mid), WHITE, TextAlign::CENTER_RIGHT, "%H:%M", clock);
          else it.printf(W - 10, 23, id(f_mid), WHITE, TextAlign::CENTER_RIGHT, "%d:%02d %s",
                         clock.hour % 12 == 0 ? 12 : clock.hour % 12, clock.minute, clock.hour < 12 ? "AM" : "PM");
        }

        // target distance + zones
        if (occ) it.printf(10, 54, id(f_mid), WHITE, TextAlign::TOP_LEFT, "Target %.2f m", id(raw_dist) / 100.0f);
        else     it.print(10, 54, id(f_mid), GREY, TextAlign::TOP_LEFT, "No target");
        const bool za = id(zone_a).state, zb = id(zone_b).state;
        if (za) it.filled_rectangle(244, 54, 32, 26, AMBER); else it.rectangle(244, 54, 32, 26, DIM);
        it.print(260, 67, id(f_small), za ? BLACK : GREY, TextAlign::CENTER, "A");
        if (zb) it.filled_rectangle(280, 54, 32, 26, AMBER); else it.rectangle(280, 54, 32, 26, DIM);
        it.print(296, 67, id(f_small), zb ? BLACK : GREY, TextAlign::CENTER, "B");

        // energy bars: label, bar 0-100, distance
        auto bar = [&](int y, const char *lab, Color col, bool on, float en, float dist_cm) {
          it.print(10, y + 9, id(f_small), on ? col : GREY, TextAlign::CENTER_LEFT, lab);
          it.rectangle(72, y, 160, 18, DIM);
          int w = (int) (fmaxf(0.0f, fminf(100.0f, en)) * 1.58f);
          if (w > 0) it.filled_rectangle(73, y + 1, w, 16, on ? col : DIM);
          it.printf(238, y + 9, id(f_small), on ? WHITE : GREY, TextAlign::CENTER_LEFT, "%3.0f", en);
          if (on) it.printf(W - 6, y + 9, id(f_small), WHITE, TextAlign::CENTER_RIGHT, "%.2fm", dist_cm / 100.0f);
        };
        bar(90, "Move", BLUE, mv, mv ? id(raw_men) : 0.0f, id(raw_mdist));
        bar(116, "Still", GREEN, st, st ? id(raw_sen) : 0.0f, id(raw_sdist));

        // footer
        it.line(0, 145, W, 145, DIM);
        it.printf(10, 158, id(f_tiny), GREY, TextAlign::CENTER_LEFT, "Clear delay %.0f s   Max gate %.0f/%.0f   %.0f B/s",
                  id(n_timeout).state, id(n_maxm).state, id(n_maxs).state, id(radar_bps).state);
        if (!id(presence_led).state) it.print(W - 6, 158, id(f_tiny), GREY, TextAlign::CENTER_RIGHT, "LED off");

      // ---------- page 1: gates ----------
      } else if (id(cur_page) == 1) {
        it.print(8, 4, id(f_small), WHITE, TextAlign::TOP_LEFT, "Gates");
        it.print(70, 8, id(f_tiny), BLUE, TextAlign::TOP_LEFT, "move");
        it.print(108, 8, id(f_tiny), GREEN, TextAlign::TOP_LEFT, "still");
        it.print(W - 6, 8, id(f_tiny), GREY, TextAlign::TOP_RIGHT, "tick = threshold, 0.75 m each");
        if (!id(sw_eng).state) {
          it.print(W / 2, 80, id(f_small), GREY, TextAlign::CENTER, "Engineering mode is off");
          it.print(W / 2, 104, id(f_tiny), GREY, TextAlign::CENTER, "turn it on in HA to see per-gate energy");
        } else {
          esphome::sensor::Sensor *gm[9] = {id(gme0), id(gme1), id(gme2), id(gme3), id(gme4), id(gme5), id(gme6), id(gme7), id(gme8)};
          esphome::sensor::Sensor *gs[9] = {id(gse0), id(gse1), id(gse2), id(gse3), id(gse4), id(gse5), id(gse6), id(gse7), id(gse8)};
          esphome::number::Number *gmt[9] = {id(gmt0), id(gmt1), id(gmt2), id(gmt3), id(gmt4), id(gmt5), id(gmt6), id(gmt7), id(gmt8)};
          esphome::number::Number *gst[9] = {id(gst0), id(gst1), id(gst2), id(gst3), id(gst4), id(gst5), id(gst6), id(gst7), id(gst8)};
          const int top = 28, base = 150, H = base - top;
          auto yv = [&](float v) { v = isnan(v) ? 0.0f : fmaxf(0.0f, fminf(100.0f, v)); return base - (int) (v * H / 100.0f); };
          it.line(0, base, W, base, DIM);
          for (int i = 0; i < 9; i++) {
            const int x = 6 + i * 35;
            const bool in_m = i <= (int) id(n_maxm).state, in_s = i <= (int) id(n_maxs).state;
            int y = yv(gm[i]->state);
            if (y < base) it.filled_rectangle(x, y, 13, base - y, in_m ? BLUE : DIM);
            y = yv(gs[i]->state);
            if (y < base) it.filled_rectangle(x + 15, y, 13, base - y, in_s ? GREEN : DIM);
            it.filled_rectangle(x - 2, yv(gmt[i]->state) - 1, 17, 3, WHITE);
            it.filled_rectangle(x + 13, yv(gst[i]->state) - 1, 17, 3, WHITE);
            it.printf(x + 14, 161, id(f_tiny), (in_m || in_s) ? WHITE : GREY, TextAlign::CENTER, "%d", i);
          }
          if (id(occupied).state) {   // mark the gate the target is on
            int g = (int) (id(raw_dist) / 75.0f); if (g > 8) g = 8;
            it.rectangle(6 + g * 35 - 3, top - 2, 34, base - top + 4, AMBER);
          }
        }

      // ---------- page 2: status ----------
      } else {
        it.print(8, 4, id(f_small), WHITE, TextAlign::TOP_LEFT, "Nu-Presence-24GHz-1");
        if (clock.is_valid()) {
          if (id(sw_24h).state) it.strftime(W - 8, 4, id(f_small), WHITE, TextAlign::TOP_RIGHT, "%H:%M:%S", clock);
          else it.printf(W - 8, 4, id(f_small), WHITE, TextAlign::TOP_RIGHT, "%d:%02d:%02d %s",
                         clock.hour % 12 == 0 ? 12 : clock.hour % 12, clock.minute, clock.second, clock.hour < 12 ? "AM" : "PM");
        }
        char ipbuf[network::IP_ADDRESS_BUFFER_SIZE] = "-";
        if (wifi::global_wifi_component != nullptr && wifi::global_wifi_component->is_connected())
          wifi::global_wifi_component->get_ip_addresses()[0].str_to(ipbuf);
        const float up = id(s_uptime).state;
        const int d = (int) (up / 86400), h = ((int) up % 86400) / 3600, m = ((int) up % 3600) / 60;
        int y = 34;
        it.printf(8, y, id(f_small), GREY, TextAlign::TOP_LEFT, "Wi-Fi  %.0f dBm  %s", id(s_rssi).state,
                  id(wd_access_point).has_state() ? id(wd_access_point).state.c_str() : ""); y += 22;
        it.printf(8, y, id(f_small), GREY, TextAlign::TOP_LEFT, "IP  %s", ipbuf); y += 22;
        it.printf(8, y, id(f_small), GREY, TextAlign::TOP_LEFT, "Uptime  %dd %02d:%02d", d, h, m); y += 22;
        it.printf(8, y, id(f_small), GREY, TextAlign::TOP_LEFT, "Radar  %.0f B/s   fw %s", id(radar_bps).state,
                  id(ts_fw).has_state() ? id(ts_fw).state.c_str() : "?"); y += 22;
        it.printf(8, y, id(f_small), GREY, TextAlign::TOP_LEFT, "MCU  %.0f F   Presence %s", id(s_mcu).state * 1.8f + 32.0f,
                  id(presence_led).state ? "LED on" : "LED off"); y += 22;
        it.print(8, y, id(f_tiny), DIM, TextAlign::TOP_LEFT, "Tuning page :8080   BOOT = next page");
      }
