# NU-AQI-6 — device-specific values only.
# All logic lives in common/nuaqi-common.yaml (edit that to change every unit).
substitutions:
  device_name: nu-aqi-6
  friendly_name: NU-AQI-6
  api_key: !secret api_key
  ota_password: !secret ota_password
  ap_ssid: "Nu-Aqi-6 Fallback Hotspot"
  ap_password: !secret ap_password
packages:
  nuaqi_common: !include common/nuaqi-common.yaml
# NOTE: this unit previously ran output_power: 18dB (highest in the fleet —
# probably the worst WiFi spot). The common package sets 8.5dB; if "WiFi
# Signal Quality" drops below ~60% after flashing, override it here:
# wifi:
#   output_power: 14dB