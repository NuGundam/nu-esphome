# Copy to secrets.yaml and fill in your own values. secrets.yaml is ignored by git.
#
# The real configs have their own api_key and ap_password per device. They all point at
# one shared name here to keep the example short; give each device its own if you prefer.

wifi_ssid: "your-wifi"
wifi_password: "your-wifi-password"

# openssl rand -base64 32
api_key: "paste-the-openssl-output-here"
ota_password: "change-me-change-me-change-me-32"
ap_password: "change-me-12"

# Used by the air quality units for sun-based night mode
home_latitude: "0.0000°"
home_longitude: "0.0000°"

# Bluetooth MAC of the AC Infinity controller (nu-esp32-s3-1 only)
aci_mac: "00:00:00:00:00:00"
