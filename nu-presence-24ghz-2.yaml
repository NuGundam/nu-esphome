  - platform: template
    id: z3x2m
    name: "Zone 3 X2"
    icon: mdi:vector-rectangle
    unit_of_measurement: "m"
    min_value: -4.86
    max_value: 4.86
    step: 0.01
    mode: box
    entity_category: config
    update_interval: 5s
    lambda: |-
      float v = id(z3x2).state;
      if (std::isnan(v)) return {};
      return v / 1000.0f;
    set_action:
      - number.set:
          id: z3x2
          value: !lambda 'return roundf(x * 1000.0f);'
  - platform: template
    id: z3y2m
    name: "Zone 3 Y2"
    icon: mdi:vector-rectangle
    unit_of_measurement: "m"
    min_value: 0
    max_value: 7.56
    step: 0.01
    mode: box
    entity_category: config
    update_interval: 5s
    lambda: |-
      float v = id(z3y2).state;
      if (std::isnan(v)) return {};
      return v / 1000.0f;
    set_action:
      - number.set:
          id: z3y2
          value: !lambda 'return roundf(x * 1000.0f);'
  # Still presence (v1.8): how long a person who faded out while still counts as sitting there
  - platform: template
    id: still_hold
    name: "Still hold"
    icon: mdi:seat-recline-normal
    unit_of_measurement: "s"
    min_value: 30
    max_value: 3600
    step: 10
    initial_value: 300
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  # Moving target sensitivity (v1.5)
  - platform: template
    id: mv_speed
    name: "Moving speed"
    icon: mdi:speedometer
    unit_of_measurement: "cm/s"
    min_value: 1
    max_value: 100
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: mv_range
    name: "Moving range"
    icon: mdi:arrow-expand-vertical
    unit_of_measurement: "m"
    min_value: 0.5
    max_value: 7.5
    step: 0.1
    initial_value: 6
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: mv_hold
    name: "Moving hold"
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 5
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: zone_hold
    name: "Zone hold"
    icon: mdi:timer-outline
    unit_of_measurement: "s"
    min_value: 0
    max_value: 600
    step: 5
    initial_value: 10
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

switch:
  - platform: ld2450
    ld2450_id: radar
    bluetooth:
      name: "Radar Bluetooth"
      entity_category: config
    multi_target:
      id: sw_multi
      name: "Multi target"
      entity_category: config
  - platform: template
    id: presence_led
    name: "Presence LED"
    icon: mdi:led-on
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
    on_turn_on:
      - script.execute: led_update
    on_turn_off:
      - script.execute: led_update

select:
  - platform: ld2450
    ld2450_id: radar
    zone_type:
      id: sel_zt
      name: "Zone type"
      entity_category: config

button:
  - platform: ld2450
    ld2450_id: radar
    factory_reset:
      name: "Radar factory reset"
      entity_category: diagnostic
    restart:
      name: "Radar restart"
      entity_category: diagnostic
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

text_sensor:
  - platform: ld2450
    ld2450_id: radar
    version:
      id: ts_fw
      name: "Radar firmware"
    mac_address:
      name: "Radar MAC"
  - platform: template
    id: led_state
    name: "Presence LED state"
    icon: mdi:led-on
    entity_category: diagnostic
    update_interval: never

light:
  - platform: esp32_rmt_led_strip
    id: led
    name: "LED"
    internal: true
    pin: GPIO3
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF
    default_transition_length: 300ms

script:
  - id: led_update
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(boot_done);'
          then:
            - if:
                condition:
                  and:
                    - switch.is_on: presence_led
                    - binary_sensor.is_on: occupied
                    - binary_sensor.is_on: bs_mv
                then:
                  - light.turn_on:          # moving target -> blue
                      id: led
                      brightness: 15%
                      red: 0
                      green: 0.1
                      blue: 1
                  - text_sensor.template.publish:
                      id: led_state
                      state: "Blue"
                else:
                  - if:
                      condition:
                        and:
                          - switch.is_on: presence_led
                          - binary_sensor.is_on: occupied
                      then:
                        - light.turn_on:    # occupied, still only -> green
                            id: led
                            brightness: 15%
                            red: 0
                            green: 1
                            blue: 0
                        - text_sensor.template.publish:
                            id: led_state
                            state: "Green"
                      else:
                        - light.turn_off:
                            id: led
                        - text_sensor.template.publish:
                            id: led_state
                            state: "Off"
