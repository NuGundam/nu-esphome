    set_action:
      - number.set:
          id: z2y1
          value: !lambda 'return roundf(x * 1000.0f);'
  - platform: template
    id: z2x2m
    name: "Zone 2 X2"
    icon: mdi:vector-rectangle
    unit_of_measurement: "m"
    min_value: -4.86
    max_value: 4.86
    step: 0.01
    mode: box
    entity_category: config
    update_interval: 5s
    lambda: |-
      float v = id(z2x2).state;
