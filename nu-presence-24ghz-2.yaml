    set_action:
      - number.set:
          id: z2y2
          value: !lambda 'return roundf(x * 1000.0f);'
  - platform: template
    id: z3x1m
    name: "Zone 3 X1"
    icon: mdi:vector-rectangle
    unit_of_measurement: "m"
    min_value: -4.86
    max_value: 4.86
    step: 0.01
    mode: box
    entity_category: config
    update_interval: 5s
    lambda: |-
      float v = id(z3x1).state;
      if (std::isnan(v)) return {};
      return v / 1000.0f;
    set_action:
      - number.set:
          id: z3x1
          value: !lambda 'return roundf(x * 1000.0f);'
  - platform: template
    id: z3y1m
    name: "Zone 3 Y1"
    icon: mdi:vector-rectangle
    unit_of_measurement: "m"
    min_value: 0
    max_value: 7.56
    step: 0.01
    mode: box
    entity_category: config
    update_interval: 5s
    lambda: |-
      float v = id(z3y1).state;
      if (std::isnan(v)) return {};
